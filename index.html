<!-- ================= FIREBASE SDK ================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDocs, getDoc, setDoc, deleteDoc, updateDoc, addDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ============================================================
  // ⚠️ CONFIG YAWE YA FIREBASE (nta mpinduka)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBundHtsiYqhvDt8Sr9e3onp1Fj9DYU_Uc",
    authDomain: "coopconnect-rwanda.firebaseapp.com",
    projectId: "coopconnect-rwanda",
    storageBucket: "coopconnect-rwanda.firebasestorage.app",
    messagingSenderId: "541021248668",
    appId: "1:541021248668:web:2caba90d523d70189b2159"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window.FB = { db, auth, collection, doc, getDocs, getDoc, setDoc, deleteDoc, updateDoc, addDoc, query, where, onSnapshot };
  window.FB_AUTH = { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged };
  window.dispatchEvent(new Event("firebase-ready"));
</script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --green: #15803d; --green-dark: #14532d; --green-light: #dcfce7;
  --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b;
  --border: #e2e8f0; --red: #dc2626; --blue: #2563eb; --orange: #f59e0b;
  --radius: 14px; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

.login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 999; overflow-y: auto; }
.login-card { background: #fff; border-radius: 20px; padding: 32px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,.3); margin: auto; }
.login-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
.login-logo i { color: var(--green); width: 36px; height: 36px; }
.login-logo strong { font-size: 22px; color: var(--green-dark); }
.login-card h2 { text-align: center; font-size: 15px; color: var(--muted); margin-bottom: 20px; font-weight: 400; }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; background: #f1f5f9; padding: 5px; border-radius: 10px; }
.auth-tab { padding: 11px; text-align: center; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); transition: .2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.auth-tab i { width: 15px; height: 15px; }
.auth-tab.active { background: #fff; color: var(--green); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
.login-card .field { margin-bottom: 12px; }
.login-btn { width: 100%; justify-content: center; padding: 13px; font-size: 15px; }
.login-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); line-height: 1.8; }

.sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; background: var(--green-dark); color: #fff; display: flex; flex-direction: column; z-index: 100; transition: transform .3s; }
.logo { display: flex; align-items: center; gap: 12px; padding: 22px 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
.logo i { color: #4ade80; width: 28px; height: 28px; }
.logo strong { font-size: 16px; display: block; }
.logo small { font-size: 11px; color: #86efac; }
.sidebar nav { flex: 1; overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 3px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 9px; color: #cbd5e1; cursor: pointer; font-size: 14px; transition: .2s; }
.nav i { width: 19px; height: 19px; }
.nav:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav.active { background: var(--green); color: #fff; font-weight: 600; }
.user-box { padding: 16px; border-top: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px; }
.user-box strong { font-size: 13px; display: block; }
.user-box small { font-size: 11px; color: #86efac; }
.user-box button { margin-left: auto; background: rgba(255,255,255,.1); border: none; color: #fff; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.user-box button:hover { background: var(--red); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0; }
.avatar.sm { width: 32px; height: 32px; font-size: 11px; }

.main { margin-left: 250px; min-height: 100vh; }
.topbar { position: sticky; top: 0; height: 66px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 50; }
.left { display: flex; align-items: center; gap: 12px; }
.left h1 { font-size: 18px; }
.menu-btn { display: none; background: #f1f5f9; border: none; width: 38px; height: 38px; border-radius: 9px; cursor: pointer; }
.right { display: flex; align-items: center; gap: 10px; }
.search { display: flex; align-items: center; gap: 8px; background: #f1f5f9; border-radius: 9px; padding: 8px 14px; width: 240px; }
.search i { width: 16px; height: 16px; color: var(--muted); }
.search input { border: none; background: none; outline: none; width: 100%; font-size: 13px; }
.icon { position: relative; background: #f1f5f9; border: none; width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-weight: 700; font-size: 12px; }
.icon i { width: 18px; height: 18px; }
.icon .dot { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; background: var(--red); border-radius: 50%; color: #fff; font-size: 9px; font-weight: 700; display: none; align-items: center; justify-content: center; }
.profile { display: flex; align-items: center; gap: 8px; padding-left: 10px; border-left: 1px solid var(--border); }
.profile span { font-size: 13px; font-weight: 600; }
.content { padding: 24px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); transition: transform .2s; }
.stat:hover { transform: translateY(-2px); }
.stat.clickable { cursor: pointer; }
.stat.clickable:hover { border-color: var(--green); }
.stat-icon { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-icon i { width: 24px; height: 24px; }
.stat-icon.g { background: var(--green-light); color: var(--green); }
.stat-icon.o { background: #fef3c7; color: #b45309; }
.stat-icon.r { background: #fee2e2; color: #b91c1c; }
.stat-icon.b { background: #dbeafe; color: #1d4ed8; }
.stat-info small { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
.stat-info strong { font-size: 20px; font-weight: 700; }
.panel { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.panel-head h2 { font-size: 15px; font-weight: 700; }
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.chart-box { height: 280px; position: relative; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 11px 12px; background: #f8fafc; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
td { padding: 12px; border-bottom: 1px solid var(--border); }
tbody tr:hover { background: #f8fafc; }
.status { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
.status.pending { background: #fef3c7; color: #b45309; }
.status.confirmed, .status.active { background: var(--green-light); color: var(--green); }
.status.rejected, .status.inactive { background: #fee2e2; color: #b91c1c; }
.badge-info { background: #dbeafe; color: #1d4ed8; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border: none; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .2s; font-family: inherit; }
.btn i { width: 16px; height: 16px; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-dark); }
.btn.ghost { background: #f1f5f9; color: var(--text); }
.btn.ghost:hover { background: #e2e8f0; }
.btn.danger { background: var(--red); color: #fff; }
.btn.danger:hover { background: #b91c1c; }
.btn.big { padding: 14px 24px; font-size: 15px; border-radius: 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.toolbar-l, .toolbar-r { display: flex; gap: 10px; flex-wrap: wrap; }

.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.field .input { width: 100%; }
.field small { font-size: 11px; color: var(--muted); display: block; margin-top: 4px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 24px; animation: pop .25s; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h3 { font-size: 17px; margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 300; }
.toast { background: var(--green-dark); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: slide .3s; min-width: 220px; }
.toast.error { background: var(--red); }
@keyframes slide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.act { background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); margin-right: 4px; }
.act:hover { background: #e2e8f0; color: var(--text); }
.act i { width: 15px; height: 15px; }
.act.del:hover { background: #fee2e2; color: var(--red); }
.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty i { width: 40px; height: 40px; margin-bottom: 10px; opacity: .5; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 90; }
.overlay.open { display: block; }
.hidden { display: none !important; }
.notice { padding: 14px 18px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
.notice.info { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
.notice.warn { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
.notice.danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
.notice.success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
.pwd-cell { font-family: monospace; background: #f1f5f9; padding: 3px 8px; border-radius: 5px; font-size: 11px; }
.coop-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.coop-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.coop-card-head h3 { font-size: 15px; }
.coop-stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; }
.coop-stats > div small { font-size: 11px; color: var(--muted); display: block; }
.coop-stats > div strong { font-size: 15px; }
.notif-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid var(--blue); box-shadow: var(--shadow); }
.notif-card.success { border-left-color: var(--green); }
.notif-card.warn { border-left-color: var(--orange); }
.notif-card.danger { border-left-color: var(--red); }
.notif-card strong { font-size: 14px; display: block; margin-bottom: 4px; }
.notif-card p { font-size: 13px; color: #475569; line-height: 1.5; }
.notif-card small { font-size: 11px; color: #94a3b8; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }

  .menu-btn { display: flex; }
  .search { display: none; }
  .profile span { display: none; }
  .content { padding: 16px; }
  .row { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
/* ============================================================
   COOPCONNECT RWANDA — v5 (Firebase + Sign up + Admin approval)
   ============================================================ */

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uid = () => "id" + Date.now() + Math.random().toString(36).slice(2,7);
const fmt = n => Number(n||0).toLocaleString() + " RWF";
const today = () => new Date().toISOString().split("T")[0];
const icons = () => window.lucide && lucide.createIcons();
const addMonths = (dateStr, months) => {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + months);
  return d.toISOString().split("T")[0];
};

let DB = {
  coops: [], members: [], contribs: [], shares: [],
  payments: [], loans: [], tx: [], ann: [], notifications: []
};

let SESSION = null;
let authMode = "login";

/* ============ FIREBASE STATE ============ */
let FB_READY = false;
window.addEventListener("firebase-ready", () => {
  FB_READY = true;
  console.log("✅ Firebase ready");
});

const FB_COLLECTIONS = ["coops","members","contribs","shares","payments","loans","tx","ann","notifications"];

/* ============ FIREBASE HELPERS ============ */
async function getUserRole(uid) {
  if (!FB_READY) return null;
  try {
    const { doc, getDoc } = window.FB;
    const userDoc = await getDoc(doc(window.FB.db, "users", uid));
    if (userDoc.exists()) return userDoc.data();
    return null;
  } catch (e) {
    console.warn("getUserRole failed:", e);
    return null;
  }
}

async function loadCoopsPublic() {
  if (!FB_READY) return;
  try {
    const { db, collection, getDocs } = window.FB;
    const snap = await getDocs(collection(db, "coops"));
    const arr = [];
    snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
    DB.coops = arr;
  } catch (e) { console.warn(e); }
}

async function fbLoadAll() {
  if (!FB_READY) return;
  const { db, collection, getDocs } = window.FB;
  for (const name of FB_COLLECTIONS) {
    try {
      const snap = await getDocs(collection(db, name));
      const arr = [];
      snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
      DB[name] = arr;
    } catch (e) { console.warn("Load failed:", name, e); }
  }
}

async function fbSaveAll() {
  if (!FB_READY) return;
  const { db, doc, setDoc } = window.FB;
  for (const name of FB_COLLECTIONS) {
    for (const item of DB[name]) {
      try { await setDoc(doc(db, name, item.id), item, { merge: true }); }
      catch (e) { console.warn("Save failed:", name, item.id, e); }
    }
  }
}

let saveTimer = null;
function scheduleSave() {
  if (!FB_READY) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { fbSaveAll(); }, 800);
}

/* ============ NOTIFICATIONS ============ */
function addNotification(memberName, title, body, type = "info") {
  DB.notifications.push({ id: uid(), memberName, title, body, type, date: today(), read: false });
}
function getMyNotifications() {
  if (!SESSION) return [];
  return DB.notifications.filter(n => n.memberName === SESSION.memberName || n.memberName === "ALL").slice().reverse();
}
function countUnread() { return getMyNotifications().filter(n => !n.read).length; }
function updateNotifDot() {
  const dot = $("#notifDot");
  if (!dot) return;

async function switchAuthMode(mode) {
  authMode = mode;
  $("#tabLogin").classList.toggle("active", mode === "login");
  $("#tabSignup").classList.toggle("active", mode === "signup");
  $("#loginForm").classList.toggle("hidden", mode !== "login");
  $("#signupForm").classList.toggle("hidden", mode !== "signup");
  $("#authSubtitle").textContent = mode === "login" ? "Injira muri sisitemu" : "Fungura account nshya";
  if (mode === "signup") {
    await loadCoopsPublic();
    const sel = $("#suCoop");
    sel.innerHTML = '<option value="">— Hitamo koperative —</option>' +
      DB.coops.map(c => `<option value="${c.name}">${c.name}</option>`).join("");

/* ============ LOGIN ============ */
async function doLogin() {
  const email = $("#loginId").value.trim();
  const pass = $("#loginPass").value.trim();
  if (!email || !pass) return toast("Uzuza ibisabwa", true);

  const btn = $("#loginBtn");
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader"></i> Tugutegereje...';
  icons();

  try {
    const { signInWithEmailAndPassword } = window.FB_AUTH;
    const userCredential = await signInWithEmailAndPassword(window.FB_AUTH.auth, email, pass);
    const user = userCredential.user;

    const roleData = await getUserRole(user.uid);
    if (!roleData) {
      await window.FB_AUTH.signOut(window.FB_AUTH.auth);
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="log-in"></i> Injira';
      icons();
      return toast("Nta role ibonetse. Vugana na Admin.", true);
    }

    if (roleData.status === "pending") {
      await window.FB_AUTH.signOut(window.FB_AUTH.auth);
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="log-in"></i> Injira';
      icons();
      return toast("⏳ Account yawe itegereje kwemezwa na Admin.", true);
    }
    if (roleData.status === "rejected") {
      await window.FB_AUTH.signOut(window.FB_AUTH.auth);
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="log-in"></i> Injira';
      icons();
      return toast("❌ Account yawe yanzwe. Vugana na Admin.", true);
    }

    SESSION = {
      uid: user.uid, email: user.email,
      name: roleData.name || user.email,
      role: roleData.role,
      memberName: roleData.memberName || null
    };

    await fbLoadAll();
    startApp();
  } catch (error) {
    console.error(error);
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="log-in"></i> Injira';
    icons();
    let msg = "Email cyangwa password si byo";
    if (error.code === "auth/user-not-found") msg = "Nta account ibonetse kuri iyi email";
    if (error.code === "auth/wrong-password") msg = "Password si yo";
    if (error.code === "auth/invalid-email") msg = "Email ntariho neza";
    toast(msg, true);
  }
}

/* ============ SIGNUP ============ */
async function doSignup() {
  const name = $("#suName").value.trim();
  const email = $("#suEmail").value.trim();
  const phone = $("#suPhone").value.trim();
  const no = $("#suNo").value.trim();
  const coop = $("#suCoop").value;
  const pass = $("#suPass").value;
  const pass2 = $("#suPass2").value;

  if (!name) return toast("Izina ni ngombwa", true);
  if (!email) return toast("Email ni ngombwa", true);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast("Email ntariho neza", true);
  if (!phone) return toast("Telefoni ni ngombwa", true);
  if (!no) return toast("Nimero ya member ni ngombwa", true);
  if (!coop) return toast("Hitamo koperative", true);
  if (pass.length < 6) return toast("Password nibura 6 characters", true);
  if (pass !== pass2) return toast("Password ntihura", true);

  const btn = $("#signupBtn");
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader"></i> Tugutegereje...';
  icons();

  try {
    // 1. Kora Firebase Auth user
    const { createUserWithEmailAndPassword } = window.FB_AUTH;
    const cred = await createUserWithEmailAndPassword(window.FB_AUTH.auth, email, pass);
    const uid = cred.user.uid;

    // 2. Bika muri users collection
    const { db, doc, setDoc, collection, addDoc } = window.FB;
    await setDoc(doc(db, "users", uid), {
      uid, email, name,
      role: "member",
      status: "pending",
      memberName: name,
      phone,
      createdAt: new Date().toISOString()
    });

    // 3. Bika mu members collection (pending)
    await addDoc(collection(db, "members"), {
      name, no, coop, phone, email,
      joined: today(),
      status: "pending",
      uid,
      createdAt: new Date().toISOString()
    });

    // 4. Notify admin
    await addDoc(collection(db, "notifications"), {
      memberName: "ALL",
      title: "🆕 Ubusabe bw'account nshya",
      body: `${name} (${email}) yisabye kwinjira muri ${coop}. Emeza cyangwa wange.`,
      type: "warn",
      date: today(),
      read: false
    });

    // 5. Sohoka muri Firebase (ntabwo yinjiye — ategereje kwemezwa)
    await window.FB_AUTH.signOut(window.FB_AUTH.auth);

    toast("✅ Ubusabe bwoherejwe! Admin azakwemereza vuba.");
    switchAuthMode("login");
    $("#loginId").value = email;
    $("#loginPass").value = "";
  } catch (error) {
    console.error(error);
    let msg = "Habaye ikibazo";
    if (error.code === "auth/email-already-in-use") msg = "Iyi email isanzweho";
    if (error.code === "auth/invalid-email") msg = "Email ntariho neza";
    if (error.code === "auth/weak-password") msg = "Password ni nkeya";
    toast(msg, true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="user-plus"></i> Fungura Account';
    icons();
  }
}

/* ============ LOGOUT ============ */
async function logout() {
  if (!confirm("Uremeza gusohoka?")) return;
  try { await window.FB_AUTH.signOut(window.FB_AUTH.auth); }
  catch (e) { console.warn(e); }

}

    if (m.uid) await updateDoc(doc(db, "users", m.uid), { status: "rejected" });
    const i = DB.members.findIndex(x => x.id === memberId);
    if (i >= 0) { DB.members[i].status = "rejected"; DB.members[i].rejectReason = reason; }
    await addDoc(collection(db, "notifications"), {

window.approveLoan = (id) => {
  const l = DB.loans.find(x => x.id === id);
  if (!l) return;
  const info = DB.members.find(m => m.name === l.member) || {};
  const coop = DB.coops.find(c => c.name === (info.coop || l.coop));
  openModal(`
    <h3>✅ Emeza inguzanyo — shyiraho inyungu</h3>
    <div class="notice info">
      <strong>${l.member}</strong> asaba <strong>${fmt(l.amount)}</strong> (${l.duration} amezi).<br>
      Impamvu: ${l.purpose}
    </div>
    ${coop ? `<div class="notice ${coop.balance >= l.amount ? 'success' : 'danger'}">
      Balance ya ${coop.name}: <strong>${fmt(coop.balance || 0)}</strong>
      ${coop.balance >= l.amount ? '' : ' — ⚠️ Ntihagije!'}
    </div>` : ''}
    <div class="field"><label>🔑 Inyungu (%) — wowe ushyiraho</label>
      <input type="number" class="input" id="apRate" value="5" min="0" max="100" step="0.5" />
    </div>
    <div class="field"><label>Itariki yo kwishyura</label>
      <input type="date" class="input" id="apDue" value="${addMonths(today(), l.duration)}" />
    </div>
    <div class="notice info" id="calcPreview"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Hagarika</button>
      <button class="btn primary" onclick="finalApproveLoan('${l.id}')">Emeza</button>
    </div>
  `);
  setTimeout(() => {
    const inp = $("#apRate");
    if (inp) {
      const update = () => {
        const r = +inp.value || 0;
        const interest = Math.round(l.amount * r / 100);
        $("#calcPreview").innerHTML = `
          💰 ${fmt(l.amount)} + 📈 ${fmt(interest)} (${r}%) = <strong>${fmt(l.amount + interest)}</strong>
        `;
      };
      inp.addEventListener("input", update);
      update();
    }
  }, 50);
};

window.finalApproveLoan = (id) => {
  const l = DB.loans.find(x => x.id === id);
  if (!l) return;
  const info = DB.members.find(m => m.name === l.member) || {};
  const coop = DB.coops.find(c => c.name === (info.coop || l.coop));
  const rate = +$("#apRate").value;
  const due = $("#apDue").value;
  if (rate < 0) return toast("Inyungu si nziza", true);
  if (coop && coop.balance < l.amount) return toast("Balance ntihagije", true);
  l.status = "approved";
  l.approvedAt = today();
  l.approvedBy = SESSION.name;
  l.interestRate = rate;
  l.dueDate = due;
  if (coop) coop.balance = (coop.balance || 0) - l.amount;
  DB.tx.push({
    id: uid(), desc: `Inguzanyo kuri ${l.member}`, type: "expense",
    cat: "Inguzanyo", amount: l.amount, date: today(), by: SESSION.name, ref: "L-" + l.id
  });
  const interest = Math.round(l.amount * rate / 100);
  addNotification(l.member, "✅ Inguzanyo yemejwe",
    `${fmt(l.amount)} yemejwe. Inyungu: ${rate}%. Yose: ${fmt(l.amount + interest)}. Due: ${due}`, "success");
  closeModal(); toast(`✅ Inguzanyo yemejwe. Inyungu: ${rate}%`); scheduleSave(); navigate("adminLoans");
};

  const stat = (ic, cl, lbl, val) => `
    <div class="stat"><div class="stat-icon ${cl}"><i data-lucide="${ic}"></i></div>
      <div class="stat-info"><small>${lbl}</small><strong>${val}</strong></div></div>`;
  $("#app").innerHTML = `
    <div class="panel" style="background:linear-gradient(135deg,#15803d,#166534);color:#fff;border:none">
      <h2>Murakaza neza, ${me}!</h2>
      <p style="opacity:.9">${info.coop || ""} — ${info.no || ""}</p>
      ${coop ? `<p style="opacity:.85;font-size:12px;margin-top:6px">💰 Balance ya koperative: <strong>${fmt(coop.balance || 0)}</strong></p>` : ''}
    </div>
    ${w ? (getTimeStatus(w) === "open" ? `<div class="notice success">📅 Igihe cyo kwishura kiragfunguye! ${w.label} — ${fmt(w.amountPerMember)}</div>` : '') : ''}
    <div class="stats">
      ${stat("hand-coins", "g", "Imisanzu", fmt(totalC))}
      ${stat("pie-chart", "b", "Imigabane", fmt(totalS))}
      ${stat("clock", "o", "Butegereje", myP.filter(x => x.status === "pending").length)}
      ${stat("banknote", "b", "Inguzanyo", fmt(totalOwed))}
    </div>
  `;
  icons();
};

PAGES.myPayContribution = () => {
  const me = SESSION.memberName;
  const info = DB.members.find(m => m.name === me) || {};
  const coop = DB.coops.find(c => c.name === info.coop);
  const w = coop?.contributionWindow;
  $("#app").innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Ishyura umusanzu</h2></div>
      ${w ? `<div style="background:#f8fafc;padding:14px;border-radius:10px;margin-bottom:16px">
        <strong>${w.label}</strong><br><small>${w.start} → ${w.end} • ${fmt(w.amountPerMember)}</small>
      </div>` : ''}
      <div class="field"><label>Amafaranga</label><input type="number" class="input" id="pmAmount" value="${w ? w.amountPerMember : ''}"></div>
      <div class="row">
        <div class="field"><label>Uburyo</label>
          <select class="input" id="pmMethod">
            <option value="MoMo">MTN MoMo</option>
            <option value="Airtel">Airtel Money</option>
            <option value="Cash">Cash</option>
          </select>
        </div>
        <div class="field"><label>Ref</label><input class="input" id="pmRef" placeholder="MP240101..."></div>
      </div>
      <div class="field"><label>Itariki</label><input type="date" class="input" id="pmDate" value="${today()}"></div>
      <button class="btn primary big" onclick="submitMyPayment()" style="width:100%;justify-content:center">
        <i data-lucide="send"></i> Ohereza
      </button>
    </div>
  `;
  icons();
};

window.submitMyPayment = () => {
  const amount = +$("#pmAmount").value;
  const method = $("#pmMethod").value;
  const ref = $("#pmRef").value.trim();
  if (!amount || amount <= 0) return toast("Amafaranga si nziza", true);
  if (!ref) return toast("Ref ni ngombwa", true);
  if (DB.payments.some(p => p.ref === ref && p.status !== "rejected")) return toast("Iyi Ref isanzweho", true);
  const me = SESSION.memberName;
  const info = DB.members.find(m => m.name === me) || {};
  DB.payments.push({
    id: uid(), member: me, memberId: info.id, coop: info.coop || "",
    amount, date: $("#pmDate").value, method, ref, status: "pending"
  });
  addNotification("ALL", "💰 Ubwishyu bushya", `${me} yishyuye ${fmt(amount)} (${method}).`, "warn");
  toast("✅ Bwoherejwe!"); scheduleSave(); navigate("myPayContribution");
};

PAGES.myLoans = () => {
  const me = SESSION.memberName;
  const myLoans = DB.loans.filter(l => l.member === me).slice().reverse();
  $("#app").innerHTML = `
    <div class="notice info">🏦 Saba inguzanyo. Admin azashyiraho inyungu.</div>
    <div class="panel">
      <div class="panel-head"><h2>Saba inguzanyo</h2></div>
      <div class="field"><label>Amafaranga</label><input type="number" class="input" id="lnAmount"></div>
      <div class="field"><label>Impamvu</label><textarea class="input" id="lnPurpose" rows="2"></textarea></div>
      <div class="field"><label>Igihe</label>
        <select class="input" id="lnDuration">
          <option value="3">3 amezi</option>
          <option value="6" selected>6 amezi</option>
          <option value="12">12 amezi</option>
          <option value="24">24 amezi</option>
        </select>
      </div>
      <button class="btn primary big" onclick="submitLoanRequest()" style="width:100%;justify-content:center"><i data-lucide="send"></i> Ohereza</button>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Amateka</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Amafaranga</th><th>Igihe</th><th>Inyungu</th><th>Status</th></tr></thead>
        <tbody>${myLoans.map(l => `<tr>
          <td>${fmt(l.amount)}</td><td>${l.duration} amezi</td>
          <td>${l.interestRate != null ? l.interestRate + '%' : '—'}</td>
          <td><span class="status ${l.status === 'approved' ? 'confirmed' : l.status === 'rejected' ? 'rejected' : 'pending'}">${l.status}</span></td>
        </tr>`).join("") || `<tr><td colspan="4" class="empty">Nta nguzanyo</td></tr>`}</tbody>
      </table></div>
    </div>
  `;
  icons();
};

window.submitLoanRequest = () => {
  const amount = +$("#lnAmount").value;
  const purpose = $("#lnPurpose").value.trim();
  const duration = +$("#lnDuration").value;
  if (!amount || amount <= 0) return toast("Amafaranga si nziza", true);
  if (!purpose) return toast("Impamvu ni ngombwa", true);
  const me = SESSION.memberName;
  const info = DB.members.find(m => m.name === me) || {};
  if (DB.loans.some(l => l.member === me && l.status === "pending")) return toast("Ufite ubusabe butegereje", true);
  DB.loans.push({
    id: uid(), member: me, memberId: info.id, coop: info.coop || "",
    amount, purpose, duration, interestRate: null,
    requestedAt: today(), status: "pending",
    approvedAt: null, approvedBy: null, rejectReason: null, dueDate: null
  });
  addNotification("ALL", "🏦 Ubusabe bw'inguzanyo", `${me} asaba ${fmt(amount)} (${duration} amezi).`, "warn");
  toast("✅ Bwoherejwe!"); scheduleSave(); navigate("myLoans");
};

PAGES.myNotif = () => {
  const list = getMyNotifications();
  $("#app").innerHTML = `
    <div class="notice info">🔔 ${list.filter(n => !n.read).length} bushya</div>
    ${list.map(n => `<div class="notif-card ${n.type}"><strong>${n.title}</strong><p>${n.body}</p><small>${n.date}</small></div>`).join("") || '<div class="empty"><p>Nta butumwa</p></div>'}
  `;
  list.forEach(n => n.read = true);
  scheduleSave();
  updateNotifDot();
};

PAGES.myProfile = () => {
  const m = DB.members.find(x => x.name === SESSION.memberName) || {};
  $("#app").innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Umwirondoro</h2></div>
      <div class="row">
        <div class="field"><label>Izina</label><input class="input" value="${m.name || ''}" disabled></div>
        <div class="field"><label>Nimero</label><input class="input" value="${m.no || ''}" disabled></div>
      </div>
      <div class="row">
        <div class="field"><label>Koperative</label><input class="input" value="${m.coop || ''}" disabled></div>
        <div class="field"><label>Email</label><input class="input" value="${SESSION.email}" disabled></div>
      </div>
    </div>
  `;
};

PAGES.myContribs = () => {
  const list = DB.contribs.filter(c => c.member === SESSION.memberName);
  $("#app").innerHTML = `
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Amafaranga</th><th>Itariki</th><th>Status</th></tr></thead>
      <tbody>${list.map(c => `<tr>
        <td>${fmt(c.amount)}</td><td>${c.date}</td>
        <td><span class="status ${c.status}">${c.status === 'pending' ? 'Bitegereje' : 'Byemejwe'}</span></td>
      </tr>`).join("") || `<tr><td colspan="3" class="empty">Nta misanzu</td></tr>`}</tbody>
    </table></div></div>
  `;
};

PAGES.myShares = () => {
  const list = DB.shares.filter(c => c.member === SESSION.memberName);
  $("#app").innerHTML = `<div class="panel"><div class="table-wrap"><table>
    <thead><tr><th>Amafaranga</th><th>Itariki</th></tr></thead>
    <tbody>${list.map(c => `<tr><td>${fmt(c.amount)}</td><td>${c.date}</td></tr>`).join("") || `<tr><td colspan="2" class="empty">Nta migabane</td></tr>`}</tbody>
  </table></div></div>`;
};

PAGES.myPayments = () => {
  const list = DB.payments.filter(c => c.member === SESSION.memberName).slice().reverse();
  $("#app").innerHTML = `<div class="panel"><div class="table-wrap"><table>
    <thead><tr><th>Amafaranga</th><th>Itariki</th><th>Ref</th><th>Status</th></tr></thead>
    <tbody>${list.map(p => `<tr><td>${fmt(p.amount)}</td><td>${p.date}</td><td>${p.ref}</td>
      <td><span class="status ${p.status}">${p.status === 'pending' ? 'Bitegereje' : 'Byemejwe'}</span></td>
    </tr>`).join("") || `<tr><td colspan="4" class="empty">Nta bwishyu</td></tr>`}</tbody>
  </table></div></div>`;
};

PAGES.myAnnounce = () => {
  $("#app").innerHTML = DB.ann.map(a => `<div class="panel"><strong>${a.title}</strong><p>${a.body}</p><small>${a.date}</small></div>`).join("") || '<div class="empty"><p>Nta butumwa</p></div>';
};

PAGES.mySettings = () => {
  $("#app").innerHTML = `
    <div class="notice info">👤 Uri kwinjira nka <strong>${SESSION.name}</strong> — ${SESSION.email}</div>
    <div class="panel">
      <div class="panel-head"><h2>🔑 Hindura Password</h2></div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px">
        Koresha Firebase Console cyangwa vugana na Admin kugira ngo uhindure password yawe.
      </p>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Sohoka</h2></div>
      <button class="btn danger" onclick="logout()"><i data-lucide="log-out"></i> Sohoka</button>
    </div>
  `;
};

function render(page) {
  if (PAGES[page]) PAGES[page]();
  icons();
}

icons();
</script>

</body>
