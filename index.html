<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CoopConnect Rwanda</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
:root{--dark-green:#1b5e20;--mid-green:#2e7d32;--light-green:#a5d6a7;--pale-green:#e8f5e9;--cream:#fdf8e7;--white:#fff;--text-dark:#1e2a1e;--text-muted:#5a6b5a;--danger:#c62828;--warning:#f9a825;--info:#1565c0;--success:#2e7d32;--border-radius:12px;--shadow:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(0,0,0,.12);--transition:all .2s ease;--font:'Segoe UI','Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--cream);color:var(--text-dark);line-height:1.5;min-height:100vh}
.hidden{display:none!important}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:.5rem}.gap-2{gap:1rem}.gap-3{gap:1.5rem}
.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.mt-3{margin-top:1.5rem}
.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}.mb-3{margin-bottom:1.5rem}
.p-1{padding:.5rem}.p-2{padding:1rem}.p-3{padding:1.5rem}
.text-center{text-align:center}.text-muted{color:var(--text-muted)}.text-sm{font-size:.85rem}.text-lg{font-size:1.25rem}.font-bold{font-weight:700}
.w-full{width:100%}.rounded{border-radius:var(--border-radius)}.shadow{box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.6rem 1.2rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:var(--transition);text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--dark-green);color:var(--white)}
.btn-primary:hover:not(:disabled){background:var(--mid-green)}
.btn-secondary{background:var(--light-green);color:var(--dark-green)}
.btn-secondary:hover:not(:disabled){background:#8bc34a}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-outline{background:transparent;border:2px solid var(--dark-green);color:var(--dark-green)}
.btn-outline:hover:not(:disabled){background:var(--pale-green)}
.btn-sm{padding:.35rem .75rem;font-size:.8rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:600;margin-bottom:.35rem;font-size:.9rem;color:var(--text-dark)}
.form-control{width:100%;padding:.65rem .9rem;border:1.5px solid #c8d6c8;border-radius:8px;font-size:.95rem;font-family:var(--font);transition:var(--transition);background:var(--white)}
.form-control:focus{outline:none;border-color:var(--mid-green);box-shadow:0 0 0 3px rgba(46,125,50,.15)}
.form-control.error{border-color:var(--danger)}
.error-text{color:var(--danger);font-size:.8rem;margin-top:.25rem}
.card{background:var(--white);border-radius:var(--border-radius);box-shadow:var(--shadow);padding:1.25rem;transition:var(--transition)}
.card:hover{box-shadow:var(--shadow-lg)}
.stat-card{background:var(--white);border-radius:var(--border-radius);padding:1.25rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.5rem;border-left:5px solid var(--mid-green)}
.stat-card .stat-value{font-size:1.8rem;font-weight:700;color:var(--dark-green)}
.stat-card .stat-label{font-size:.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.badge{display:inline-block;padding:.25rem .65rem;border-radius:20px;font-size:.75rem;font-weight:600;text-transform:capitalize}
.badge-pending{background:#fff3e0;color:#e65100}
.badge-approved{background:#e8f5e9;color:#1b5e20}
.badge-rejected{background:#ffebee;color:#c62828}
.badge-suspended{background:#fce4ec;color:#880e4f}
.badge-active{background:#e8f5e9;color:#1b5e20}
.badge-inactive{background:#eceff1;color:#455a64}
.badge-processing{background:#e3f2fd;color:#0d47a1}
.badge-confirmed{background:#e8f5e9;color:#1b5e20}
.badge-failed{background:#ffebee;color:#c62828}
.badge-disbursed{background:#e3f2fd;color:#0d47a1}
.badge-repaid{background:#e8f5e9;color:#1b5e20}
.badge-under_review{background:#fff8e1;color:#f57f17}
.table-wrapper{overflow-x:auto;border-radius:var(--border-radius);background:var(--white);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:var(--pale-green);color:var(--dark-green);font-weight:700;text-align:left;padding:.75rem 1rem;white-space:nowrap}
td{padding:.7rem 1rem;border-bottom:1px solid #e8ece8}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f7faf7}
.sidebar{width:260px;background:var(--dark-green);color:var(--white);display:flex;flex-direction:column;padding:1.5rem 0;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s ease;overflow-y:auto}
.sidebar-brand{padding:0 1.5rem 1.5rem;font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:1rem}
.sidebar-brand i{color:var(--light-green)}
.sidebar-nav{display:flex;flex-direction:column;gap:.2rem;padding:0 .75rem}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.7rem 1rem;border-radius:8px;color:rgba(255,255,255,.85);cursor:pointer;transition:var(--transition);font-weight:500;font-size:.9rem}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.12);color:var(--white)}
.nav-item i{width:1.2rem;text-align:center}
.sidebar-footer{margin-top:auto;padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,.15);font-size:.8rem;color:rgba(255,255,255,.6)}
.main-content{flex:1;margin-left:260px;padding:1.5rem 2rem;transition:margin .25s ease}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap}
.topbar h1{font-size:1.5rem;font-weight:700;color:var(--dark-green)}
.topbar-actions{display:flex;align-items:center;gap:1rem}
.user-chip{display:flex;align-items:center;gap:.6rem;background:var(--white);padding:.4rem 1rem .4rem .4rem;border-radius:40px;box-shadow:var(--shadow);font-size:.85rem;font-weight:600}
.user-avatar{width:2rem;height:2rem;border-radius:50%;background:var(--mid-green);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.menu-toggle{display:none;background:var(--dark-green);color:var(--white);border:none;padding:.5rem .7rem;border-radius:8px;cursor:pointer;font-size:1.2rem}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--dark-green) 0%,var(--mid-green) 100%);padding:1rem}
.login-card{background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);padding:2.5rem 2rem;width:100%;max-width:440px;max-height:95vh;overflow-y:auto}
.login-brand{text-align:center;margin-bottom:2rem}
.login-brand .logo-icon{font-size:2.5rem;color:var(--dark-green);margin-bottom:.5rem}
.login-brand h1{font-size:1.5rem;color:var(--dark-green);font-weight:800}
.login-brand p{color:var(--text-muted);font-size:.9rem}
.password-wrapper{position:relative}
.password-wrapper .toggle-password{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem}
.login-footer{text-align:center;margin-top:1.25rem;font-size:.85rem}
.login-footer a{color:var(--mid-green);cursor:pointer;font-weight:600;text-decoration:none}
.login-footer a:hover{text-decoration:underline}
.auth-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:2px solid #e0e8e0}
.auth-tab{flex:1;padding:.6rem;border:none;background:none;cursor:pointer;font-weight:700;font-size:.95rem;color:var(--text-muted);border-bottom:3px solid transparent;transition:var(--transition)}
.auth-tab.active{color:var(--dark-green);border-bottom-color:var(--dark-green)}
.auth-tab:hover{color:var(--dark-green)}
.spinner{display:inline-block;width:1rem;height:1rem;border:2px solid rgba(255,255,255,.4);border-top-color:var(--white);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:9999}
.loading-overlay .spinner{width:3rem;height:3rem;border-width:4px;border-color:rgba(255,255,255,.3);border-top-color:var(--white)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem}
.modal{background:var(--white);border-radius:var(--border-radius);box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:1.5rem}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.modal-header h3{color:var(--dark-green)}
.modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--text-muted);line-height:1}
#toast-container{position:fixed;top:1rem;right:1rem;z-index:10000;display:flex;flex-direction:column;gap:.5rem;max-width:360px}
.toast{padding:.85rem 1.2rem;border-radius:8px;color:var(--white);font-weight:500;font-size:.9rem;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:.6rem}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--info)}.toast-warning{background:var(--warning);color:var(--text-dark)}
.chart-container{position:relative;height:260px;width:100%}
@media(max-width:900px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0}.menu-toggle{display:inline-block}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}}
.grid{display:grid;gap:1rem}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.grid-4,.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--text-muted)}
.empty-state i{font-size:2.5rem;color:var(--light-green);margin-bottom:.75rem}
.search-bar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.search-bar .form-control{max-width:300px}
.divider{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:var(--text-muted);font-size:.85rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e0e8e0}
</style>
</head>
<body>

<!-- ============ LOGIN / REGISTER ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-icon"><i class="fas fa-handshake"></i></div>
      <h1>CoopConnect Rwanda</h1>
      <p>Cooperative Management Platform</p>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login">Sign In</button>
      <button type="button" class="auth-tab" id="tab-register">Register</button>
    </div>

    <div id="login-panel">
      <div id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="you@coop.rw" autocomplete="email" />
          <div id="login-email-error" class="error-text hidden"></div>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-password" id="toggle-password-btn"><i class="fas fa-eye"></i></button>
          </div>
          <div id="login-password-error" class="error-text hidden"></div>
        </div>
        <div id="login-general-error" class="error-text hidden mb-1"></div>
        <button type="button" id="login-btn" class="btn btn-primary w-full">
          <span id="login-btn-text">Sign In</span>
          <span id="login-btn-spinner" class="spinner hidden"></span>
        </button>
      </div>
      <div class="login-footer">
        <a id="forgot-password-link">Forgot password?</a>
      </div>
      <div id="forgot-password-section" class="hidden mt-2">
        <div class="form-group">
          <label for="reset-email">Enter your email to reset password</label>
          <input type="email" id="reset-email" class="form-control" placeholder="you@coop.rw" />
        </div>
        <button type="button" id="send-reset-btn" class="btn btn-secondary w-full">Send Reset Email</button>
        <div id="reset-message" class="text-sm mt-1"></div>
      </div>
    </div>

    <div id="register-panel" class="hidden">
      <div id="register-form">
        <div class="form-group">
          <label for="reg-fullname">Full Name</label>
          <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Alice Uwase" />
          <div id="reg-fullname-error" class="error-text hidden"></div>
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@coop.rw" />
          <div id="reg-email-error" class="error-text hidden"></div>
        </div>
        <div class="form-group">
          <label for="reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+250 7XX XXX XXX" />
          <div id="reg-phone-error" class="error-text hidden"></div>
        </div>
        <div class="form-group">
          <label for="reg-role">Register As</label>
          <select id="reg-role" class="form-control">
            <option value="member">Member</option>
            <option value="employee">Employee</option>
          </select>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 characters" />
            <button type="button" class="toggle-password" id="toggle-reg-password-btn"><i class="fas fa-eye"></i></button>
          </div>
          <div id="reg-password-error" class="error-text hidden"></div>
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" class="form-control" placeholder="Re-enter password" />
          <div id="reg-confirm-error" class="error-text hidden"></div>
        </div>
        <div id="register-general-error" class="error-text hidden mb-1"></div>
        <button type="button" id="register-btn" class="btn btn-primary w-full">
          <span id="register-btn-text">Create Account</span>
          <span id="register-btn-spinner" class="spinner hidden"></span>
        </button>
      </div>
      <div class="login-footer">
        Already have an account? <a id="go-login-link">Sign in</a>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app-shell" class="hidden">
  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="fas fa-handshake"></i> CoopConnect</div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div id="sidebar-user-name"></div>
      <div id="sidebar-user-role" class="text-sm" style="opacity:.7"></div>
    </div>
  </aside>
  <main class="main-content" id="main-content">
    <div class="topbar">
      <div class="flex items-center gap-1">
        <button class="menu-toggle" id="menu-toggle-btn"><i class="fas fa-bars"></i></button>
        <h1 id="page-title">Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <div class="user-chip">
          <div class="user-avatar" id="topbar-avatar">U</div>
          <span id="topbar-user-name">User</span>
        </div>
        <button class="btn btn-outline btn-sm" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
    <div id="page-content"></div>
  </main>
</div>

<div id="toast-container"></div>

<script type="module">
// ============================================================
// FIREBASE IMPORTS & CONFIG
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, onAuthStateChanged, sendPasswordResetEmail, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc,
  updateDoc, query, where, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA7OfUycQUBA39tZu_bRO3VHdE3m_gxp_Q",
  authDomain: "coopconnect-rwanda-78799.firebaseapp.com",
  projectId: "coopconnect-rwanda-78799",
  storageBucket: "coopconnect-rwanda-78799.firebasestorage.app",
  messagingSenderId: "636839006720",
  appId: "1:636839006720:web:e3b4f666616d6600133ee5"
};

let app, auth, db;
try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
} catch (err) {
  console.error("Firebase init error:", err);
  setTimeout(() => showToast("Firebase init failed. Check config.", "error", 8000), 500);
}

const state = { user: null, profile: null, role: null, cooperativeId: null, currentView: "dashboard", charts: {} };

// ============================================================
// DOM HELPERS
// ============================================================
const $ = (sel, parent = document) => parent.querySelector(sel);
const $$ = (sel, parent = document) => [...parent.querySelectorAll(sel)];

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === "className") node.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(node.dataset, v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  });
  children.forEach(c => {
    if (c == null) return;
    if (typeof c === "string" || typeof c === "number") node.appendChild(document.createTextNode(String(c)));
    else node.appendChild(c);
  });
  return node;
}

function showToast(message, type = "info", duration = 4000) {
  const container = $("#toast-container");
  if (!container) return;
  const icons = { success: "fa-check-circle", error: "fa-exclamation-circle", warning: "fa-exclamation-triangle", info: "fa-info-circle" };
  const toast = el("div", { className: `toast toast-${type}` },
    el("i", { className: `fas ${icons[type] || icons.info}` }),
    el("span", {}, message)
  );
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = "0";
    toast.style.transform = "translateX(100%)";
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

function showLoading(show) {
  let overlay = $("#loading-overlay");
  if (show) {
    if (!overlay) {
      overlay = el("div", { id: "loading-overlay", className: "loading-overlay" }, el("div", { className: "spinner" }));
      document.body.appendChild(overlay);
    }
  } else if (overlay) overlay.remove();
}

function openModal(title, contentNode, onClose) {
  const backdrop = el("div", { className: "modal-backdrop", id: "modal-backdrop" });
  const modal = el("div", { className: "modal" });
  modal.appendChild(el("div", { className: "modal-header" },
    el("h3", {}, title),
    el("button", { className: "modal-close", onClick: () => { backdrop.remove(); onClose && onClose(); } }, "×")
  ));
  modal.appendChild(contentNode);
  backdrop.appendChild(modal);
  backdrop.addEventListener("click", e => { if (e.target === backdrop) { backdrop.remove(); onClose && onClose(); } });
  document.body.appendChild(backdrop);
  return { backdrop, modal };
}

function confirmDialog(title, message, onConfirm) {
  const content = el("div", {},
    el("p", { className: "mb-2" }, message),
    el("div", { className: "flex gap-1 justify-between mt-2" },
      el("button", { className: "btn btn-outline", onClick: () => $("#modal-backdrop")?.remove() }, "Cancel"),
      el("button", { className: "btn btn-danger", onClick: () => { $("#modal-backdrop")?.remove(); onConfirm(); } }, "Confirm")
    )
  );
  openModal(title, content);
}

// ============================================================
// AUTH TAB SWITCH
// ============================================================
function switchAuthTab(tab) {
  if (tab === "login") {
    $("#login-panel").classList.remove("hidden");
    $("#register-panel").classList.add("hidden");
    $("#tab-login").classList.add("active");
    $("#tab-register").classList.remove("active");
  } else {
    $("#login-panel").classList.add("hidden");
    $("#register-panel").classList.remove("hidden");
    $("#tab-register").classList.add("active");
    $("#tab-login").classList.remove("active");
  }
}
$("#tab-login").addEventListener("click", () => switchAuthTab("login"));
$("#tab-register").addEventListener("click", () => switchAuthTab("register"));
$("#go-login-link").addEventListener("click", () => switchAuthTab("login"));

function friendlyAuthError(err) {
  const code = err.code || "";
  if (code.includes("user-not-found")) return "No account found with this email.";
  if (code.includes("wrong-password") || code.includes("invalid-credential")) return "Incorrect email or password.";
  if (code.includes("invalid-email")) return "Invalid email format.";
  if (code.includes("user-disabled")) return "This account is disabled.";
  if (code.includes("too-many-requests")) return "Too many attempts. Try later.";
  if (code.includes("network-request-failed")) return "Network error. Check connection.";
  if (code.includes("email-already-in-use")) return "Email already registered.";
  if (code.includes("weak-password")) return "Password too weak (min 6 chars).";
  if (code.includes("operation-not-allowed")) return "Email/password sign-in not enabled in Firebase Console.";
  return err.message || "Authentication failed.";
}

// ============================================================
// LOGIN BUTTON
// ============================================================
function bindLoginButton() {
  const emailInput = $("#login-email");
  const passwordInput = $("#login-password");
  const loginBtn = $("#login-btn");
  const btnText = $("#login-btn-text");
  const btnSpinner = $("#login-btn-spinner");
  const generalError = $("#login-general-error");

  $("#toggle-password-btn").addEventListener("click", () => {
    const type = passwordInput.type === "password" ? "text" : "password";
    passwordInput.type = type;
    $("#toggle-password-btn i").className = type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
  });

  $("#forgot-password-link").addEventListener("click", () => {
    $("#forgot-password-section").classList.toggle("hidden");
  });

  $("#send-reset-btn").addEventListener("click", async () => {
    const email = $("#reset-email").value.trim();
    const msg = $("#reset-message");
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.textContent = "Enter a valid email."; msg.style.color = "var(--danger)"; return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      msg.textContent = "Reset email sent."; msg.style.color = "var(--success)";
    } catch (err) {
      msg.textContent = friendlyAuthError(err); msg.style.color = "var(--danger)";
    }
  });

  loginBtn.addEventListener("click", async () => {
    if (loginBtn.disabled) return;

    generalError.classList.add("hidden");
    $("#login-email-error").classList.add("hidden");
    $("#login-password-error").classList.add("hidden");

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    let valid = true;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      $("#login-email-error").textContent = "Enter a valid email.";
      $("#login-email-error").classList.remove("hidden");
      emailInput.classList.add("error");
      valid = false;
    } else emailInput.classList.remove("error");

    if (!password || password.length < 6) {
      $("#login-password-error").textContent = "Password min 6 characters.";
      $("#login-password-error").classList.remove("hidden");
      passwordInput.classList.add("error");
      valid = false;
    } else passwordInput.classList.remove("error");

    if (!valid) return;

    loginBtn.disabled = true;
    btnText.textContent = "Signing in...";
    btnSpinner.classList.remove("hidden");

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      const user = cred.user;
      if (!user) throw new Error("No user returned.");

      const profileSnap = await getDoc(doc(db, "profiles", user.uid));
      if (!profileSnap.exists()) {
        showToast("No profile found. Contact admin.", "error", 6000);
        await signOut(auth);
        return;
      }
      const profile = profileSnap.data();
      const status = profile.status || "pending";
      if (status !== "approved") {
        const msgs = { pending: "Account pending approval.", rejected: "Account rejected.", suspended: "Account suspended." };
        showToast(msgs[status] || "Account not approved.", "error", 6000);
        await signOut(auth);
        return;
      }
      showToast("Welcome back!", "success");
    } catch (err) {
      console.error("Login error:", err);
      generalError.textContent = friendlyAuthError(err);
      generalError.classList.remove("hidden");
    } finally {
      loginBtn.disabled = false;
      btnText.textContent = "Sign In";
      btnSpinner.classList.add("hidden");
    }
  });

  [emailInput, passwordInput].forEach(inp => {
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); loginBtn.click(); }
    });
  });
}

// ============================================================
// REGISTER BUTTON
// ============================================================
function bindRegisterButton() {
  const registerBtn = $("#register-btn");
  const btnText = $("#register-btn-text");
  const btnSpinner = $("#register-btn-spinner");
  const generalError = $("#register-general-error");

  $("#toggle-reg-password-btn").addEventListener("click", () => {
    const pwd = $("#reg-password");
    const type = pwd.type === "password" ? "text" : "password";
    pwd.type = type;
    $("#toggle-reg-password-btn i").className = type === "password" ? "fas fa-eye" : "fas fa-eye-slash";
  });

  registerBtn.addEventListener("click", async () => {
    if (registerBtn.disabled) return;

    generalError.classList.add("hidden");
    $$("#register-form .error-text").forEach(n => n.classList.add("hidden"));
    $$("#register-form .form-control").forEach(n => n.classList.remove("error"));

    const fullName = $("#reg-fullname").value.trim();
    const email = $("#reg-email").value.trim();
    const phone = $("#reg-phone").value.trim();
    const role = $("#reg-role").value;
    const password = $("#reg-password").value;
    const confirm = $("#reg-confirm").value;

    let valid = true;
    if (!fullName || fullName.length < 3) {
      $("#reg-fullname-error").textContent = "Full name required (min 3).";
      $("#reg-fullname-error").classList.remove("hidden");
      $("#reg-fullname").classList.add("error"); valid = false;
    }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      $("#reg-email-error").textContent = "Valid email required.";
      $("#reg-email-error").classList.remove("hidden");
      $("#reg-email").classList.add("error"); valid = false;
    }
    if (!phone || phone.length < 8) {
      $("#reg-phone-error").textContent = "Valid phone required.";
      $("#reg-phone-error").classList.remove("hidden");
      $("#reg-phone").classList.add("error"); valid = false;
    }
    if (!password || password.length < 6) {
      $("#reg-password-error").textContent = "Password min 6 characters.";
      $("#reg-password-error").classList.remove("hidden");
      $("#reg-password").classList.add("error"); valid = false;
    }
    if (password !== confirm) {
      $("#reg-confirm-error").textContent = "Passwords do not match.";
      $("#reg-confirm-error").classList.remove("hidden");
      $("#reg-confirm").classList.add("error"); valid = false;
    }
    if (!valid) return;

    registerBtn.disabled = true;
    btnText.textContent = "Creating account...";
    btnSpinner.classList.remove("hidden");

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      const user = cred.user;

      try { await updateProfile(user, { displayName: fullName }); } catch (e) { console.warn("updateProfile:", e); }

      await setDoc(doc(db, "profiles", user.uid), {
        uid: user.uid, fullName, email, phone,
        role: role === "employee" ? "employee" : "member",
        status: "pending", cooperativeId: null,
        createdAt: serverTimestamp()
      });

      showToast("Account created! Pending admin approval.", "success", 7000);
      await signOut(auth);

      ["reg-fullname","reg-email","reg-phone","reg-password","reg-confirm"].forEach(id => { const n = $("#"+id); if (n) n.value = ""; });
      switchAuthTab("login");
      $("#login-email").value = email;
    } catch (err) {
      console.error("Register error:", err);
      generalError.textContent = friendlyAuthError(err);
      generalError.classList.remove("hidden");
    } finally {
      registerBtn.disabled = false;
      btnText.textContent = "Create Account";
      btnSpinner.classList.add("hidden");
    }
  });

  ["reg-fullname","reg-email","reg-phone","reg-password","reg-confirm"].forEach(id => {
    const n = $("#"+id);
    if (n) n.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); registerBtn.click(); }
    });
  });
}

// ============================================================
// AUTH STATE OBSERVER
// ============================================================
onAuthStateChanged(auth, async (user) => {
  if (user) {
    state.user = user;
    showLoading(true);
    try {
      const profileSnap = await getDoc(doc(db, "profiles", user.uid));
      if (!profileSnap.exists()) {
        showToast("Profile missing. Contact admin.", "error");
        await signOut(auth);
        return;
      }
      const profile = { id: profileSnap.id, ...profileSnap.data() };
      state.profile = profile;
      state.role = profile.role || "member";
      state.cooperativeId = profile.cooperativeId || null;

      const status = profile.status || "pending";
      if (status !== "approved") {
        const msgs = { pending: "Account pending approval.", rejected: "Account rejected.", suspended: "Account suspended." };
        showToast(msgs[status] || "Account not approved.", "error", 6000);
        await signOut(auth);
        return;
      }

      $("#login-screen").classList.add("hidden");
      $("#app-shell").classList.remove("hidden");
      $("#topbar-user-name").textContent = profile.fullName || user.email || "User";
      $("#topbar-avatar").textContent = (profile.fullName || user.email || "U").charAt(0).toUpperCase();
      $("#sidebar-user-name").textContent = profile.fullName || user.email;
      $("#sidebar-user-role").textContent = state.role.charAt(0).toUpperCase() + state.role.slice(1);

      buildSidebar();
      navigate("dashboard");
    } catch (err) {
      console.error("Profile load error:", err);
      showToast("Failed to load profile: " + (err.message || ""), "error");
      await signOut(auth);
    } finally {
      showLoading(false);
    }
  } else {
    state.user = null; state.profile = null; state.role = null; state.cooperativeId = null;
    $("#app-shell").classList.add("hidden");
    $("#login-screen").classList.remove("hidden");
    $("#page-content").innerHTML = "";
    Object.values(state.charts).forEach(c => { try { c.destroy(); } catch(e){} });
    state.charts = {};
    switchAuthTab("login");
  }
});

$("#logout-btn").addEventListener("click", () => {
  confirmDialog("Logout", "Are you sure you want to log out?", async () => {
    try { await signOut(auth); showToast("Logged out.", "success"); }
    catch (err) { showToast("Logout failed: " + err.message, "error"); }
  });
});

function buildSidebar() {
  const nav = $("#sidebar-nav"); nav.innerHTML = "";
  const items = NAV_ITEMS[state.role] || NAV_ITEMS.member;
  items.forEach(item => {
    nav.appendChild(el("div", {
      className: `nav-item${state.currentView === item.id ? " active" : ""}`,
      dataset: { view: item.id },
      onClick: () => { navigate(item.id); closeMobileSidebar(); }
    }, el("i", { className: `fas ${item.icon}` }), el("span", {}, item.label)));
  });
}
function setActiveNav(v) { $$(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.view === v)); }

$("#menu-toggle-btn").addEventListener("click", () => {
  $("#sidebar").classList.toggle("open");
  $("#sidebar-backdrop").classList.toggle("hidden");
});
$("#sidebar-backdrop").addEventListener("click", closeMobileSidebar);
function closeMobileSidebar() { $("#sidebar").classList.remove("open"); $("#sidebar-backdrop").classList.add("hidden"); }

// ROUTER
// ============================================================
const viewRenderers = {
  dashboard: renderDashboard,
  users: renderUsers,
  members: renderMembers, employees: renderEmployees,
  shares: renderShares, loans: renderLoans, transactions: renderTransactions,
  announcements: renderAnnouncements, reports: renderReports,
  "my-shares": renderMyShares, "my-loans": renderMyLoans, "my-transactions": renderMyTransactions
};

async function navigate(viewId) {
  state.currentView = viewId;
  setActiveNav(viewId);
  const content = $("#page-content"); content.innerHTML = "";
  const titles = {
    dashboard: "Dashboard", users: "User Approvals", members: "Member Management", employees: "Employee Management",
    shares: "Share Contributions", loans: "Loan Management", transactions: "Financial Transactions",
    announcements: "Announcements", reports: "Reports",
    "my-shares": "My Share Contributions", "my-loans": "My Loan Applications", "my-transactions": "My Transactions"
  };
  $("#page-title").textContent = titles[viewId] || "Dashboard";
  Object.values(state.charts).forEach(c => { try { c.destroy(); } catch(e){} });
  state.charts = {};
  const renderer = viewRenderers[viewId];
  if (renderer) {
    try { await renderer(content); }
    catch (err) {
      console.error("Render error:", err);
      content.appendChild(el("div", { className: "card empty-state" },
        el("i", { className: "fas fa-exclamation-triangle" }),
        el("p", {}, "Failed to load: " + (err.message || "Unknown"))
      ));
    }
  } else {
    content.appendChild(el("div", { className: "card empty-state" }, el("p", {}, "Section not available.")));
  }
}

// ============================================================
// DATA HELPERS
// ============================================================
async function fetchCollection(name, conditions = []) {
  let q = collection(db, name);
  conditions.forEach(c => { q = query(q, where(c.field, c.op, c.value)); });
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
function formatDate(ts) {
  if (!ts) return "—";
  let d;
  if (ts.toDate) d = ts.toDate();
  else if (ts instanceof Date) d = ts;
  else if (typeof ts === "number") d = new Date(ts);
  else return String(ts);
  return d.toLocaleDateString("en-RW", { year: "numeric", month: "short", day: "numeric" });
}
function formatCurrency(a, c = "RWF") { if (a == null || isNaN(a)) return `${c} 0`; return `${c} ${Number(a).toLocaleString()}`; }
function statCard(label, value, icon) {
  return el("div", { className: "stat-card" },
    el("div", { className: "flex items-center justify-between" },
      el("span", { className: "stat-label" }, label),
      el("i", { className: `fas ${icon}`, style: { color: "var(--mid-green)", fontSize: "1.2rem" } })
    ),
    el("div", { className: "stat-value" }, String(value))
  );
}
function aggregateByMonth(items) {
  const map = {};
  items.forEach(it => {
    const ts = it.createdAt || it.date; if (!ts) return;
    let d; if (ts.toDate) d = ts.toDate(); else if (typeof ts === "number") d = new Date(ts); else if (ts instanceof Date) d = ts; else return;
    const key = d.toLocaleDateString("en-RW", { year: "numeric", month: "short" });
    map[key] = (map[key] || 0) + (Number(it.amount) || 0);
  });
  const labels = Object.keys(map);
  return { labels, values: labels.map(l => map[l]) };
}
function formGroup(label, id, type = "text", required = false, value = "", readOnly = false) {
  return el("div", { className: "form-group" },
    el("label", { for: id }, label, required ? el("span", { style: { color: "var(--danger)" } }, " *") : null),
    el("input", { type, id, className: "form-control", required: required ? "required" : undefined, value: value || "", readOnly: readOnly ? "readonly" : undefined })
  );
}

// ============================================================
// USERS (APPROVALS)
// ============================================================
async function renderUsers(container) {
  const pendingUsers = await fetchCollection("profiles", [{ field: "status", op: "==", value: "pending" }]);
  const allUsers = await fetchCollection("profiles");
  const otherUsers = allUsers.filter(u => u.uid !== state.user.uid);

  if (otherUsers.length === 0) {
    container.appendChild(el("div", { className: "card empty-state" }, el("i", { className: "fas fa-users" }), el("p", {}, "No other users found.")));
    return;
  }

  container.appendChild(el("div", { className: "grid grid-3 mb-3" },
    statCard("Total Users", otherUsers.length, "fa-users"),
    statCard("Pending Approvals", pendingUsers.length, "fa-clock"),
    statCard("Approved Users", otherUsers.filter(u => u.status === "approved").length, "fa-check-circle")
  ));

  const table = el("div", { className: "table-wrapper" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Name"), el("th", {}, "Email"), el("th", {}, "Role"), el("th", {}, "Status"), el("th", {}, "Actions"))),
    el("tbody", {}, ...otherUsers.map(u =>
      el("tr", {},
        el("td", {}, u.fullName || "—"),
        el("td", {}, u.email || "—"),
        el("td", {}, el("span", { style: { textTransform: "capitalize" } }, u.role || "member")),
        el("td", {}, el("span", { className: "badge badge-" + (u.status || "pending") }, u.status || "pending")),
        el("td", {},
          u.status === "pending"
            ? el("div", { className: "flex gap-1" },
                el("button", { className: "btn btn-sm btn-secondary", onClick: () => updateUserStatus(u.uid, "approved") }, "Approve"),
                el("button", { className: "btn btn-sm btn-danger", onClick: () => updateUserStatus(u.uid, "rejected") }, "Reject")
              )
            : el("button", { className: "btn btn-sm btn-outline", onClick: () => updateUserStatus(u.uid, "suspended") }, "Suspend")
        )
      )
    ))
  ));
  container.appendChild(table);

  async function updateUserStatus(uid, newStatus) {
    confirmDialog("Confirm Action", `Are you sure you want to set this user's status to "${newStatus}"?`, async () => {
      try {
        showLoading(true);
        await updateDoc(doc(db, "profiles", uid), {
          status: newStatus,
          updatedAt: serverTimestamp(),
          updatedBy: state.user.uid
        });
        showToast(`User status updated to ${newStatus}.`, "success");
        navigate("users");
      } catch (err) {
        showToast("Failed: " + err.message, "error");
      } finally {
        showLoading(false);
      }
    });
  }
}

// ============================================================
// DASHBOARD & REMAINING CODE
// ============================================================
async function renderDashboard(c) {
  if (state.role === "admin") return renderAdminDashboard(c);
  if (state.role === "employee") return renderEmployeeDashboard(c);
  return renderMemberDashboard(c);
}

async function renderAdminDashboard(container) {
  const coopId = state.cooperativeId;
  const [members, loans, transactions, contributions] = await Promise.all([
    fetchCollection("cooperative_members", coopId ? [{ field: "cooperativeId", op: "==", value: coopId }] : []),
    fetchCollection("loan_applications", coopId ? [{ field: "cooperativeId", op: "==", value: coopId }] : []),
    fetchCollection("transactions", coopId ? [{ field: "cooperativeId", op: "==", value: coopId }] : []),
    fetchCollection("share_contributions", coopId ? [{ field: "cooperativeId", op: "==", value: coopId }] : [])
  ]);
  const totalMembers = members.length;
  const activeMembers = members.filter(m => (m.status || m.membershipStatus) === "active").length;
  const pendingMembers = members.filter(m => (m.status || m.membershipStatus) === "pending").length;
  const pendingLoans = loans.filter(l => l.status === "pending" || l.status === "under_review").length;
  const approvedLoans = loans.filter(l => l.status === "approved" || l.status === "disbursed").length;
  const totalShares = contributions.filter(c => c.status === "confirmed").reduce((s, c) => s + (Number(c.amount) || 0), 0);
  const income = transactions.filter(t => t.type === "income" || t.category === "income").reduce((s, t) => s + (Number(t.amount) || 0), 0);
  const expenses = transactions.filter(t => t.type === "expense" || t.category === "expense").reduce((s, t) => s + (Number(t.amount) || 0), 0);

  container.appendChild(el("div", { className: "grid grid-4 mb-3" },
    statCard("Total Members", totalMembers, "fa-users"),
    statCard("Active Members", activeMembers, "fa-user-check"),
    statCard("Pending Approvals", pendingMembers, "fa-user-clock"),
    statCard("Total Shares (RWF)", totalShares.toLocaleString(), "fa-coins"),
    statCard("Pending Loans", pendingLoans, "fa-clock"),
    statCard("Approved Loans", approvedLoans, "fa-check-circle"),
    statCard("Income (RWF)", income.toLocaleString(), "fa-arrow-up"),
    statCard("Expenses (RWF)", expenses.toLocaleString(), "fa-arrow-down")
  ));

  const chartsGrid = el("div", { className: "grid grid-2 mb-3" });
  chartsGrid.appendChild(el("div", { className: "card" },
    el("h3", { className: "mb-2" }, "Share Contributions"),
    el("div", { className: "chart-container" }, el("canvas", { id: "chart-contributions" }))
  ));
  chartsGrid.appendChild(el("div", { className: "card" },
    el("h3", { className: "mb-2" }, "Income vs Expenses"),
    el("div", { className: "chart-container" }, el("canvas", { id: "chart-income-expenses" }))
  ));
  container.appendChild(chartsGrid);

  container.appendChild(el("div", { className: "card mb-3" },
    el("h3", { className: "mb-2" }, "Loan Application Status"),
    el("div", { className: "chart-container", style: { height: "220px" } }, el("canvas", { id: "chart-loans" }))
  ));

  const recent = transactions.slice(0, 5);
  container.appendChild(el("div", { className: "card" },
    el("h3", { className: "mb-2" }, "Recent Activities"),
    recent.length === 0
      ? el("div", { className: "empty-state" }, el("i", { className: "fas fa-inbox" }), el("p", {}, "No recent activities."))
      : el("div", { className: "table-wrapper" }, el("table", {},
          el("thead", {}, el("tr", {}, el("th", {}, "Date"), el("th", {}, "Type"), el("th", {}, "Amount"), el("th", {}, "Description"))),
          el("tbody", {}, ...recent.map(t =>
            el("tr", {},
              el("td", {}, formatDate(t.date || t.createdAt)),
              el("td", {}, t.type || t.category || "—"),
              el("td", {}, formatCurrency(t.amount, t.currency)),
              el("td", {}, t.description || "—")
            )
          ))
        ))
  ));

  requestAnimationFrame(() => {
    const cc = $("#chart-contributions");
    if (cc) {
      const m = aggregateByMonth(contributions.filter(c => c.status === "confirmed"));
      state.charts.contrib = new Chart(cc, {
        type: "bar",
        data: { labels: m.labels, datasets: [{ label: "Share Contributions (RWF)", data: m.values, backgroundColor: "#2e7d32", borderRadius: 6 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });
    }
    const ic = $("#chart-income-expenses");
    if (ic) {
      state.charts.ie = new Chart(ic, {
        type: "doughnut",
        data: { labels: ["Income", "Expenses"], datasets: [{ data: [income, expenses], backgroundColor: ["#43a047", "#e53935"] }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } }
      });
    }
    const lc = $("#chart-loans");
    if (lc) {
      const sc = { pending: 0, under_review: 0, approved: 0, rejected: 0, disbursed: 0, repaid: 0 };
      loans.forEach(l => { if (sc[l.status] !== undefined) sc[l.status]++; });
      state.charts.loans = new Chart(lc, {
        type: "polarArea",
        data: {
          labels: Object.keys(sc).map(s => s.replace("_", " ")),
          datasets: [{ data: Object.values(sc), backgroundColor: ["#ffb74d", "#fff176", "#81c784", "#e57373", "#64b5f6", "#4db6ac"] }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } }
      });
    }
  });
}

async function renderMembers(container) {
  const coopId = state.cooperativeId;
  const members = await fetchCollection("cooperative_members", coopId ? [{ field: "cooperativeId", op: "==", value: coopId }] : []);

  container.appendChild(el("div", { className: "search-bar" },
    el("input", { type: "text", className: "form-control", placeholder: "Search members...", id: "member-search" }),
    el("select", { className: "form-control", id: "member-status-filter", style: { maxWidth: "180px" } },
      el("option", { value: "" }, "All Statuses"),
      el("option", { value: "active" }, "Active"),
      el("option", { value: "pending" }, "Pending"),
      el("option", { value: "inactive" }, "Inactive")
    ),
    el("button", { className: "btn btn-primary", id: "add-member-btn" }, el("i", { className: "fas fa-plus" }), "Add Member")
  ));

  const tableContainer = el("div", { id: "members-table-container" });
  container.appendChild(tableContainer);

  function renderTable(filtered) {
    tableContainer.innerHTML = "";
    if (filtered.length === 0) {
      tableContainer.appendChild(el("div", { className: "card empty-state" }, el("i", { className: "fas fa-users" }), el("p", {}, "No members found.")));
      return;
    }
    tableContainer.appendChild(el("div", { className: "table-wrapper" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Member #"), el("th", {}, "Full Name"), el("th", {}, "Phone"), el("th", {}, "Email"), el("th", {}, "Status"), el("th", {}, "Actions"))),
      el("tbody", {}, ...filtered.map(m =>
        el("tr", {},
          el("td", {}, m.memberNumber || "—"),
          el("td", {}, m.fullName || "—"),
          el("td", {}, m.phone || "—"),
          el("td", {}, m.email || "—"),
          el("td", {}, el("span", { className: "badge badge-" + (m.status || m.membershipStatus || "pending") }, m.status || m.membershipStatus || "pending")),
          el("td", {}, el("button", { className: "btn btn-sm btn-outline", onClick: () => editMember(m) }, el("i", { className: "fas fa-edit" })))
        )
      ))
    )));
  }

  function applyFilter() {
    const s = ($("#member-search")?.value || "").toLowerCase();
    const sf = $("#member-status-filter")?.value || "";
    renderTable(members.filter(m => {
      const ms = !s || (m.fullName || "").toLowerCase().includes(s) || (m.email || "").toLowerCase().includes(s) || (m.memberNumber || "").toLowerCase().includes(s);
      const st = (m.status || m.membershipStatus || "pending");
      return ms && (!sf || st === sf);
    }));
  }

  $("#member-search")?.addEventListener("input", applyFilter);
  $("#member-status-filter")?.addEventListener("change", applyFilter);
  $("#add-member-btn").addEventListener("click", addMember);

  function addMember() {
    const form = el("div", {},
      formGroup("Full Name", "member-fullName", "text", true),
      formGroup("Member Number", "member-number", "text", true),
      formGroup("Phone", "member-phone", "tel", true),
      formGroup("Email", "member-email", "email", true),
      formGroup("District", "member-district", "text", false),
      formGroup("Membership Date", "member-date", "date", false),
      el("div", { className: "form-group" },
        el("label", {}, "Status"),
        el("select", { className: "form-control", id: "member-status" },
          el("option", { value: "active" }, "Active"),
          el("option", { value: "pending" }, "Pending"),
          el("option", { value: "inactive" }, "Inactive")
        )
      ),
      el("button", { type: "button", className: "btn btn-primary w-full mt-2", onClick: async () => {
        const fullName = $("#member-fullName").value.trim();
        const memberNumber = $("#member-number").value.trim();
        const phone = $("#member-phone").value.trim();
        const email = $("#member-email").value.trim();
        if (!fullName || !memberNumber || !phone || !email) { showToast("Fill all required fields.", "error"); return; }
        if (members.find(m => m.memberNumber === memberNumber)) { showToast("Member number already exists.", "error"); return; }
        try {
          showLoading(true);
          await addDoc(collection(db, "cooperative_members"), {
            cooperativeId: coopId, fullName, memberNumber, phone, email,
            district: $("#member-district").value.trim(),
            membershipDate: $("#member-date").value || null,
            status: $("#member-status").value,
            createdAt: serverTimestamp(), createdBy: state.user.uid
          });
          showToast("Member added.", "success");
          $("#modal-backdrop")?.remove();
          navigate("members");
        } catch (err) { showToast("Failed: " + err.message, "error"); }
        finally { showLoading(false); }
      } }, "Save Member")
    );
    openModal("Add Member", form);
  }

  function editMember(member) {
    const form = el("div", {},
      formGroup("Full Name", "edit-fullName", "text", true, member.fullName),
      formGroup("Member Number", "edit-number", "text", true, member.memberNumber, true),
      formGroup("Phone", "edit-phone", "tel", true, member.phone),
      formGroup("Email", "edit-email", "email", true, member.email),
      formGroup("District", "edit-district", "text", false, member.district),
      el("div", { className: "form-group" },
        el("label", {}, "Status"),
        el("select", { className: "form-control", id: "edit-status" },
          ...["active", "pending", "inactive"].map(s =>
            el("option", { value: s, selected: (member.status || member.membershipStatus) === s ? "selected" : undefined }, s)
          )
        )
      ),
      el("button", { type: "button", className: "btn btn-primary w-full mt-2", onClick: async () => {
        try {
          showLoading(true);
          await updateDoc(doc(db, "cooperative_members", member.id), {
            fullName: $("#edit-fullName").value.trim(),
            phone: $("#edit-phone").value.trim(),
            email: $("#edit-email").value.trim(),
            district: $("#edit-district").value.trim(),
            status: $("#edit-status").value,
            updatedAt: serverTimestamp(), updatedBy: state.user.uid
          });
          showToast("Member updated.", "success");
          $("#modal-backdrop")?.remove();
          navigate("members");
        } catch (err) { showToast("Failed: " + err.message, "error"); }
        finally { showLoading(false); }
      } }, "Update Member")
    );
    openModal("Edit Member", form);
  }

  renderTable(members);
}

    grid.appendChild(el("div", { className: "card" },
      el("div", { className: "flex items-center gap-1 mb-2" },
        el("i", { className: `fas ${r.icon}`, style: { color: "var(--mid-green)", fontSize: "1.5rem" } }),
        el("div", {}, el("h3", {}, r.title), el("div", { className: "text-muted text-sm" }, `${r.count} records`))
      ),
      el("button", { className: "btn btn-secondary btn-sm", onClick: () => exportCSV(r.data, r.filename) }, el("i", { className: "fas fa-download" }), "Export CSV")
    ));
  });
  container.appendChild(grid);
}

function exportCSV(data, filename) {
  if (!data || data.length === 0) { showToast("No data to export.", "warning"); return; }
  const keys = Object.keys(data[0]).filter(k => k !== "id");
  const header = keys.join(",");
  const rows = data.map(obj => keys.map(k => {
    let v = obj[k];
    if (v && typeof v === "object" && v.toDate) v = v.toDate().toISOString();
    if (v && typeof v === "object") v = JSON.stringify(v);
    return `"${String(v ?? "").replace(/"/g, '""')}"`;
  }).join(","));
  const csv = [header, ...rows].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("CSV exported.", "success");
}

async function renderMyLoans(container) {
  const uid = state.user.uid;
  const loans = await fetchCollection("loan_applications", [{ field: "memberId", op: "==", value: uid }]);
  container.appendChild(el("div", { className: "mb-2" },
    el("button", { className: "btn btn-primary", onClick: () => applyForLoan() }, el("i", { className: "fas fa-plus" }), "Apply for Loan")
  ));
  if (loans.length === 0) {
    container.appendChild(el("div", { className: "card empty-state" }, el("i", { className: "fas fa-hand-holding-usd" }), el("p", {}, "You have no loan applications.")));
    return;
  }
  container.appendChild(el("div", { className: "table-wrapper" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "Date"), el("th", {}, "Amount"), el("th", {}, "Purpose"), el("th", {}, "Status"))),
    el("tbody", {}, ...loans.map(l =>
      el("tr", {},
        el("td", {}, formatDate(l.createdAt || l.applicationDate)),
        el("td", {}, formatCurrency(l.amount, l.currency)),
        el("td", {}, l.purpose || "—"),
        el("td", {}, el("span", { className: "badge badge-" + (l.status || "pending") }, (l.status || "pending").replace("_", " ")))
      )
    ))
  )));
  function applyForLoan() {
    const form = el("div", {},
      formGroup("Amount (RWF)", "loan-amount", "number", true),
      el("div", { className: "form-group" },
        el("label", {}, "Purpose"),
        el("textarea", { id: "loan-purpose", className: "form-control", rows: "3" })
      ),
      el("button", { type: "button", className: "btn btn-primary w-full mt-2", onClick: async () => {
        const amount = parseFloat($("#loan-amount").value);
        const purpose = $("#loan-purpose").value.trim();
        if (!amount || amount <= 0 || !purpose) { showToast("Enter valid amount and purpose.", "error"); return; }
        try {
          showLoading(true);
          await addDoc(collection(db, "loan_applications"), {
            cooperativeId: state.cooperativeId, memberId: state.user.uid,
            memberName: state.profile?.fullName || "",
            amount, currency: "RWF", purpose, status: "pending",
            createdAt: serverTimestamp()
          });
          showToast("Loan application submitted.", "success");
          $("#modal-backdrop")?.remove();
          navigate("my-loans");
        } catch (err) { showToast("Failed: " + err.message, "error"); }
        finally { showLoading(false); }
      } }, "Submit Application")
    );
    openModal("Loan Application", form);
  }
}
