<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoopConnect Rwanda</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --green: #15803d; --green-dark: #14532d; --green-light: #dcfce7;
  --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b;
  --border: #e2e8f0; --red: #dc2626; --blue: #2563eb; --orange: #f59e0b;
  --radius: 14px; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

/* LOGIN */
.login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 999; }
.login-card { background: #fff; border-radius: 20px; padding: 40px 32px; width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.login-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
.login-logo i { color: var(--green); width: 36px; height: 36px; }
.login-logo strong { font-size: 22px; color: var(--green-dark); }
.login-card h2 { text-align: center; font-size: 15px; color: var(--muted); margin-bottom: 24px; font-weight: 400; }
.role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; background: #f1f5f9; padding: 6px; border-radius: 12px; }
.role-tab { padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); transition: .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.role-tab i { width: 16px; height: 16px; }
.role-tab.active { background: #fff; color: var(--green); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
.login-card .field { margin-bottom: 16px; }
.login-btn { width: 100%; justify-content: center; padding: 14px; font-size: 15px; }
.login-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); line-height: 1.8; }
.login-hint code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 11px; }

/* SIDEBAR */
.sidebar { position: fixed; top: 0; left: 0; width: 250px; height: 100vh; background: var(--green-dark); color: #fff; display: flex; flex-direction: column; z-index: 100; transition: transform .3s; }
.logo { display: flex; align-items: center; gap: 12px; padding: 22px 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
.logo i { color: #4ade80; width: 28px; height: 28px; }
.logo strong { font-size: 16px; display: block; }
.logo small { font-size: 11px; color: #86efac; }
.sidebar nav { flex: 1; overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 3px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 9px; color: #cbd5e1; cursor: pointer; font-size: 14px; transition: .2s; }
.nav i { width: 19px; height: 19px; }
.nav:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav.active { background: var(--green); color: #fff; font-weight: 600; }
.user-box { padding: 16px; border-top: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px; }
.user-box strong { font-size: 13px; display: block; }
.user-box small { font-size: 11px; color: #86efac; }
.user-box button { margin-left: auto; background: rgba(255,255,255,.1); border: none; color: #fff; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.user-box button:hover { background: var(--red); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0; }
.avatar.sm { width: 32px; height: 32px; font-size: 11px; }

/* MAIN */
.main { margin-left: 250px; min-height: 100vh; }
.topbar { position: sticky; top: 0; height: 66px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 50; }
.left { display: flex; align-items: center; gap: 12px; }
.left h1 { font-size: 18px; }
.menu-btn { display: none; background: #f1f5f9; border: none; width: 38px; height: 38px; border-radius: 9px; cursor: pointer; }
.right { display: flex; align-items: center; gap: 10px; }
.search { display: flex; align-items: center; gap: 8px; background: #f1f5f9; border-radius: 9px; padding: 8px 14px; width: 240px; }
.search i { width: 16px; height: 16px; color: var(--muted); }
.search input { border: none; background: none; outline: none; width: 100%; font-size: 13px; }
.icon { position: relative; background: #f1f5f9; border: none; width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); font-weight: 700; font-size: 12px; }
.icon i { width: 18px; height: 18px; }
.icon .dot { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; background: var(--red); border-radius: 50%; color: #fff; font-size: 9px; font-weight: 700; display: none; align-items: center; justify-content: center; }
.profile { display: flex; align-items: center; gap: 8px; padding-left: 10px; border-left: 1px solid var(--border); }
.profile span { font-size: 13px; font-weight: 600; }
.content { padding: 24px; }

/* CARDS */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); transition: transform .2s; }
.stat:hover { transform: translateY(-2px); }
.stat.clickable { cursor: pointer; }
.stat.clickable:hover { border-color: var(--green); }
.stat-icon { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-icon i { width: 24px; height: 24px; }
.stat-icon.g { background: var(--green-light); color: var(--green); }
.stat-icon.o { background: #fef3c7; color: #b45309; }
.stat-icon.r { background: #fee2e2; color: #b91c1c; }
.stat-icon.b { background: #dbeafe; color: #1d4ed8; }
.stat-info small { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
.stat-info strong { font-size: 20px; font-weight: 700; }
.panel { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
.panel-head h2 { font-size: 15px; font-weight: 700; }
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.chart-box { height: 280px; position: relative; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 11px 12px; background: #f8fafc; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
td { padding: 12px; border-bottom: 1px solid var(--border); }
tbody tr:hover { background: #f8fafc; }
.status { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
.status.pending { background: #fef3c7; color: #b45309; }
.status.confirmed, .status.active { background: var(--green-light); color: var(--green); }
.status.rejected, .status.inactive { background: #fee2e2; color: #b91c1c; }
.badge-info { background: #dbeafe; color: #1d4ed8; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; border: none; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; transition: .2s; font-family: inherit; }
.btn i { width: 16px; height: 16px; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-dark); }
.btn.ghost { background: #f1f5f9; color: var(--text); }
.btn.ghost:hover { background: #e2e8f0; }
.btn.danger { background: var(--red); color: #fff; }
.btn.danger:hover { background: #b91c1c; }
.btn.big { padding: 16px 28px; font-size: 16px; border-radius: 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.toolbar-l, .toolbar-r { display: flex; gap: 10px; flex-wrap: wrap; }
.input { padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 13px; outline: none; font-family: inherit; background: #fff; }
.input:focus { border-color: var(--green); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.field .input { width: 100%; }
.field small { font-size: 11px; color: var(--muted); display: block; margin-top: 4px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 24px; animation: pop .25s; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal h3 { font-size: 17px; margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 300; }
.toast { background: var(--green-dark); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: slide .3s; min-width: 220px; }
.toast.error { background: var(--red); }
@keyframes slide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.act { background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); margin-right: 4px; }
.act:hover { background: #e2e8f0; color: var(--text); }
.act i { width: 15px; height: 15px; }
.act.del:hover { background: #fee2e2; color: var(--red); }
.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty i { width: 40px; height: 40px; margin-bottom: 10px; opacity: .5; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 90; }
.overlay.open { display: block; }
.hidden { display: none !important; }
.notice { padding: 14px 18px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
.notice.info { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
.notice.warn { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
.notice.danger { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
.notice.success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
.pwd-box { background: #f0fdf4; border: 2px dashed #16a34a; padding: 14px; border-radius: 10px; margin: 12px 0; }
.pwd-box .pwd-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.pwd-box .pwd-value { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--green-dark); letter-spacing: 1px; }
.pwd-cell { font-family: monospace; background: #f1f5f9; padding: 3px 8px; border-radius: 5px; font-size: 11px; }
.warn-box { background: #fef2f2; border: 2px solid #dc2626; padding: 16px; border-radius: 10px; margin: 14px 0; }
.warn-box .warn-title { color: #991b1b; font-weight: 700; font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.warn-box .warn-title i { width: 20px; height: 20px; }
.warn-box .warn-text { color: #7f1d1d; font-size: 13px; line-height: 1.6; }
.coop-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.coop-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.coop-card-head h3 { font-size: 15px; }
.coop-stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; }
.coop-stats > div small { font-size: 11px; color: var(--muted); display: block; }
.coop-stats > div strong { font-size: 15px; }
.notif-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; border-left: 4px solid var(--blue); box-shadow: var(--shadow); }
.notif-card.success { border-left-color: var(--green); }
.notif-card.warn { border-left-color: var(--orange); }
.notif-card.danger { border-left-color: var(--red); }
.notif-card strong { font-size: 14px; display: block; margin-bottom: 4px; }
.notif-card p { font-size: 13px; color: #475569; line-height: 1.5; }
.notif-card small { font-size: 11px; color: #94a3b8; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .menu-btn { display: flex; }
  .search { display: none; }
  .profile span { display: none; }
  .content { padding: 16px; }
  .row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <i data-lucide="landmark"></i>
      <strong>CoopConnect</strong>
    </div>
    <h2>Injira muri sisitemu</h2>
    <div class="role-tabs">
      <div class="role-tab active" id="tabAdmin" onclick="switchLoginRole('admin')">
        <i data-lucide="shield-check"></i> Admin
      </div>
      <div class="role-tab" id="tabMember" onclick="switchLoginRole('member')">
        <i data-lucide="user"></i> Umunyamuryango
      </div>
    </div>
    <div class="field">
      <label id="loginLabel">Email</label>
      <input class="input" id="loginId" placeholder="admin@coopconnect.rw" />
    </div>
    <div class="field">
      <label>Ijambo ry'ibanga</label>
      <input class="input" type="password" id="loginPass" placeholder="••••••" />
    </div>
    <button class="btn primary login-btn" onclick="doLogin()">
      <i data-lucide="log-in"></i> Injira
    </button>
    <div class="login-hint">
      <strong>Admin:</strong> <code>admin@coopconnect.rw</code> / <code>admin123</code><br>
      <strong>Member demo:</strong> <code>aline</code> / <code>1234</code>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-root" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <i data-lucide="landmark"></i>
      <div><strong>CoopConnect</strong><small>Rwanda</small></div>
    </div>
    <nav id="sidebarNav"></nav>
    <div class="user-box">
      <div class="avatar" id="userAvatar">AD</div>
      <div style="flex:1;min-width:0">
        <strong id="userName" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">Admin</strong>
        <small id="userRoleLabel">Umuyobozi</small>
      </div>
      <button onclick="logout()" title="Sohoka"><i data-lucide="log-out"></i></button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar">
      <div class="left">
        <button class="menu-btn" id="menuBtn"><i data-lucide="menu"></i></button>
        <h1 id="title">Ahabanza</h1>
      </div>
      <div class="right">
        <div class="search"><i data-lucide="search"></i><input id="search" placeholder="Shakisha..."></div>
        <button class="icon" id="langBtn">RW</button>
        <button class="icon" id="notifBtn" title="Ubutumwa">
          <i data-lucide="bell"></i>
          <span class="dot" id="notifDot"></span>
        </button>
        <div class="profile"><div class="avatar sm" id="topAvatar">AD</div><span id="topName">Admin</span></div>
      </div>
    </header>
    <main class="content" id="app"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
   COOPCONNECT RWANDA — v3
   - Koperative ifite account (balance)
   - Admin ashyiraho igihe cyo kwishura
   - Member yishyura, admin yemeza (Accept gusa)
   - Loans: member asaba, admin yemera cyangwa yanga
   - Admin ni we ushyiraho interest rate
   - Notifications zitandukanye
   ============================================================ */

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uid = () => "id" + Date.now() + Math.random().toString(36).slice(2,7);
const fmt = n => Number(n||0).toLocaleString() + " RWF";
const today = () => new Date().toISOString().split("T")[0];
const icons = () => window.lucide && lucide.createIcons();
const genPass = () => Math.random().toString(36).slice(-8);
const addMonths = (dateStr, months) => {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + months);
  return d.toISOString().split("T")[0];
};

let DB = {
  accounts: [
    { id: "a1", name: "Admin", email: "admin@coopconnect.rw", username: null, password: "admin123", role: "admin", memberName: null },
    { id: "a2", name: "Mukamana Aline", email: "aline@example.com", username: "aline", password: "1234", role: "member", memberName: "Mukamana Aline" },
    { id: "a3", name: "Habimana Jean", email: "jean@example.com", username: "jean", password: "1234", role: "member", memberName: "Habimana Jean" },
    { id: "a4", name: "Uwase Grace", email: "grace@example.com", username: "grace", password: "1234", role: "member", memberName: "Uwase Grace" }
  ],
  coops: [
    {
      id: "c1", name: "Koperative Ubumwe", code: "COOP-001", location: "Kigali",
      founded: "2018-03-12", balance: 45000,
      contributionWindow: {
        start: today(),
        end: new Date(Date.now() + 30*24*60*60*1000).toISOString().split("T")[0],
        amountPerMember: 5000,
        label: "Umusanzu w'ukwezi"
      }
    },
    {
      id: "c2", name: "Koperative Duterimbere", code: "COOP-002", location: "Musanze",
      founded: "2020-07-01", balance: 12000,
      contributionWindow: null
    }
  ],
  members: [
    { id: "m1", name: "Mukamana Aline", no: "M-001", coop: "Koperative Ubumwe", phone: "0788111222", email: "aline@example.com", joined: "2022-01-10", status: "active" },
    { id: "m2", name: "Habimana Jean", no: "M-002", coop: "Koperative Duterimbere", phone: "0788333444", email: "jean@example.com", joined: "2021-05-20", status: "active" },
    { id: "m3", name: "Uwase Grace", no: "M-003", coop: "Koperative Ubumwe", phone: "0788555666", email: "grace@example.com", joined: "2023-02-14", status: "inactive" }
  ],
  contribs: [
    { id: "ct1", member: "Mukamana Aline", coop: "Koperative Ubumwe", amount: 5000, date: "2024-01-15", method: "MoMo", ref: "REF-001", status: "confirmed", submittedBy: "admin" }
  ],
  shares: [
    { id: "s1", member: "Mukamana Aline", coop: "Koperative Ubumwe", amount: 10000, date: "2024-01-20", method: "MoMo", ref: "SH-001", status: "confirmed" }
  ],
  payments: [
    { id: "p1", member: "Habimana Jean", memberId: "m2", coop: "Koperative Duterimbere", amount: 3000, date: "2024-02-01", method: "Airtel", ref: "REF-002", status: "pending" }
  ],
  loans: [
    { id: "l1", member: "Mukamana Aline", memberId: "m1", coop: "Koperative Ubumwe",
      amount: 20000, purpose: "Kugura ibikoresho by'ubuhinzi", duration: 6,
      interestRate: null, requestedAt: "2024-02-01", status: "pending",
      approvedAt: null, approvedBy: null, rejectReason: null, dueDate: null }
  ],
  tx: [
    { id: "t1", desc: "Umusanzu wa Mukamana", type: "income", cat: "Imisanzu", amount: 5000, date: "2024-01-15", by: "Admin", ref: "T-001" }
  ],
  ann: [
    { id: "n1", title: "Inama rusange", body: "Inama izaba ku wa 30/03/2024.", date: today() }
  ],
  notifications: [
    { id: "n1", memberName: "ALL", title: "👋 Murakaza neza", body: "CoopConnect Rwanda iratangira. Muri sisitemu nshya yo gucunga koperative yawe.", type: "info", date: today(), read: false }
  ]
};

let SESSION = null;
let loginRole = "admin";

/* ============ NOTIFICATIONS HELPERS ============ */
function addNotification(memberName, title, body, type = "info") {
  DB.notifications.push({
    id: uid(), memberName, title, body, type,
    date: today(), read: false
  });
}
function getMyNotifications() {
  if (!SESSION) return [];
  const list = DB.notifications.filter(n =>
    n.memberName === SESSION.memberName || n.memberName === "ALL"
  );
  return list.slice().reverse();
}
function countUnread() {
  return getMyNotifications().filter(n => !n.read).length;
}
function updateNotifDot() {
  const dot = $("#notifDot");
  if (!dot) return;
  const c = countUnread();
  if (c > 0) { dot.style.display = "flex"; dot.textContent = c; }
  else { dot.style.display = "none"; }
}

/* ============ LOGIN ============ */
function switchLoginRole(role) {
  loginRole = role;
  $("#tabAdmin").classList.toggle("active", role === "admin");
  $("#tabMember").classList.toggle("active", role === "member");
  if (role === "admin") {
    $("#loginLabel").textContent = "Email";
    $("#loginId").placeholder = "admin@coopconnect.rw";
    $("#loginId").value = "admin@coopconnect.rw";
    $("#loginPass").value = "admin123";
  } else {
    $("#loginLabel").textContent = "Username";
    $("#loginId").placeholder = "urugero: aline";
    $("#loginId").value = "";
    $("#loginPass").value = "";
  }
}

function doLogin() {
  const id = $("#loginId").value.trim();
  const pass = $("#loginPass").value.trim();
  if (!id || !pass) return toast("Uzuza ibisabwa", true);
  let acc;
  if (loginRole === "admin") {
    acc = DB.accounts.find(a => a.role === "admin" && a.email && a.email.toLowerCase() === id.toLowerCase() && a.password === pass);
  } else {
    acc = DB.accounts.find(a => a.role === "member" && a.username && a.username.toLowerCase() === id.toLowerCase() && a.password === pass);
  }
  if (!acc) return toast(loginRole === "admin" ? "Email cyangwa password si byo" : "Username cyangwa password si byo", true);
  SESSION = { id: acc.id, name: acc.name, role: acc.role, memberName: acc.memberName, email: acc.email, username: acc.username };
  startApp();
}

function logout() {
  if (!confirm("Uremeza gusohoka?")) return;
  SESSION = null;
  location.reload();
}

function startApp() {
  if (!SESSION) return;
  $("#loginScreen").classList.add("hidden");
  $("#app-root").classList.remove("hidden");
  const initials = SESSION.name.split(" ").map(x => x[0]).join("").slice(0,2).toUpperCase();
  $("#userAvatar").textContent = initials;
  $("#topAvatar").textContent = initials;
  $("#userName").textContent = SESSION.name;
  $("#topName").textContent = SESSION.name;
  $("#userRoleLabel").textContent = SESSION.role === "admin" ? "Umuyobozi" : "Umunyamuryango";
  buildSidebar();
  updateNotifDot();
  navigate(SESSION.role === "admin" ? "dashboard" : "myDashboard");
}

    { page: "mySettings", icon: "settings", label: "Igenamiterere" }

function navigate(page) {
  $$(".nav").forEach(x => x.classList.toggle("active", x.dataset.page === page));

  render(page);
  updateNotifDot();
}

  const el = document.createElement("div");

  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 3500);

window.saveWindow = (coopId) => {
  const c = DB.coops.find(x => x.id === coopId);
  const start = $("#wStart").value;
  const end = $("#wEnd").value;
  const amount = +$("#wAmount").value;
  const label = $("#wLabel").value.trim() || "Umusanzu";
  if (!start || !end || !amount) return toast("Uzuza ibisabwa", true);
  if (end < start) return toast("Itariki irangira ntirenze iyo itangira", true);

  const isNew = !c.contributionWindow;
  c.contributionWindow = { start, end, amountPerMember: amount, label };

  DB.members.filter(m => m.coop === c.name && m.status === "active").forEach(m => {
    addNotification(m.name, "📅 Igihe cyo kwishura cyafungutse",
      `${label} — ${fmt(amount)}. Igihe: ${start} → ${end}.`, "info");
  });

  closeModal();
  toast(isNew ? "✅ Igihe cyashyizweho" : "✅ Igihe cyahinduwe");
  navigate("contributionWindow");
};

  if (!confirm("Uremeza gufunga igihe cyo kwishura?")) return;

  toast("Igihe cyafunze"); navigate("contributionWindow");

window.approveLoan = (id) => {
  const l = DB.loans.find(x => x.id === id);
  if (!l) return;
  const info = DB.members.find(m => m.name === l.member) || {};
  const coop = DB.coops.find(c => c.name === (info.coop || l.coop));

  openModal(`
    <h3>✅ Emeza inguzanyo — shyiraho inyungu</h3>
    <div class="notice info">
      <strong>${l.member}</strong> asaba <strong>${fmt(l.amount)}</strong>.
      <br>Impamvu: ${l.purpose}
      <br>Igihe: ${l.duration} amezi
    </div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px">
      Iyo wemeje:<br>1. Amafaranga <strong>${fmt(l.amount)}</strong> asohoka kuri balance ya ${coop ? coop.name : 'koperative'}
      <br>2. <strong>Inyungu ushyizeho</strong> izandikwa
      <br>3. Member ahabwa notification
    </p>
    ${coop ? `<div class="notice ${coop.balance >= l.amount ? 'success' : 'danger'}">
      Balance ya ${coop.name}: <strong>${fmt(coop.balance || 0)}</strong>
      ${coop.balance >= l.amount ? '' : ' — ⚠️ Ntihagije!'}
    </div>` : ''}
    <div class="field">
      <label>🔑 Inyungu (%) — <strong>wowe ushyiraho</strong></label>
      <input type="number" class="input" id="apRate" value="5" min="0" max="100" step="0.5" />
      <small>Urugero: 5 = 5% ku mwaka</small>
    </div>
    <div class="field">
      <label>Itariki yo kwishyura (due date)</label>
      <input type="date" class="input" id="apDue" value="${addMonths(today(), l.duration)}" />
    </div>
    <div class="notice info" style="font-size:12px" id="calcPreview"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Hagarika</button>
      <button class="btn primary" onclick="finalApproveLoan('${l.id}')">Emeza</button>
    </div>
  `);
  setTimeout(() => {
    const inp = $("#apRate");
    if (inp) {
      const updatePreview = () => {
        const r = +inp.value || 0;
        const interest = Math.round(l.amount * r / 100);
        const total = l.amount + interest;
        const monthly = Math.round(total / l.duration);
        $("#calcPreview").innerHTML = `
          💰 Amafaranga: <strong>${fmt(l.amount)}</strong><br>
          📈 Inyungu (${r}%): <strong>${fmt(interest)}</strong><br>
          💵 Yose hamwe: <strong>${fmt(total)}</strong><br>
          📅 Buri kwezi: <strong>${fmt(monthly)}</strong> (${l.duration} amezi)
        `;
      };
      inp.addEventListener("input", updatePreview);
      updatePreview();
    }
  }, 50);
};

window.finalApproveLoan = (id) => {
  const l = DB.loans.find(x => x.id === id);
  if (!l) return;
  const info = DB.members.find(m => m.name === l.member) || {};
  const coop = DB.coops.find(c => c.name === (info.coop || l.coop));
  const rate = +$("#apRate").value;
  const due = $("#apDue").value;

  if (rate < 0) return toast("Inyungu ntishobora kuba mbi", true);
  if (!due) return toast("Itariki yo kwishyura ni ngombwa", true);
  if (coop && coop.balance < l.amount) return toast("Balance ya koperative ntihagije", true);

  l.status = "approved";
  l.approvedAt = today();
  l.approvedBy = SESSION.name;
  l.interestRate = rate;
  l.dueDate = due;

  if (coop) coop.balance = (coop.balance || 0) - l.amount;

  DB.tx.push({
    id: uid(), desc: `Inguzanyo kuri ${l.member}`, type: "expense",
    cat: "Inguzanyo", amount: l.amount, date: today(), by: SESSION.name, ref: "L-" + l.id
  });

  const interest = Math.round(l.amount * rate / 100);
  const total = l.amount + interest;
  addNotification(l.member, "✅ Inguzanyo yawe yemejwe",
    `${fmt(l.amount)} yemejwe. Inyungu: ${rate}%. Yose hamwe: ${fmt(total)}. Itariki yo kwishyura: ${due}.`, "success");

  closeModal();
  toast(`✅ Inguzanyo ya ${l.member} yemejwe. Inyungu: ${rate}%`);
  navigate("adminLoans");
};

window.rejectLoanForm = (id) => {
  const l = DB.loans.find(x => x.id === id);

  openModal(`

window.finalRejectLoan = (id) => {
  const sel = $("#rjReason").value;
  const other = $("#rjOther")?.value.trim();
  const reason = sel === "__other" ? other : sel;
  if (!reason) return toast("Hitamo cyangwa andika impamvu", true);

  const l = DB.loans.find(x => x.id === id);
  l.status = "rejected";

  addNotification(l.member, "❌ Ubusabe bw'inguzanyo bwanze",
    `Impamvu: ${reason}. Ushobora kongera gusaba.`, "danger");

  closeModal();
  toast("Inguzanyo yanzwe. Member yamenyeshejwe.");

  const o = sel.options[sel.selectedIndex];
  const username = $("#acUser").value.trim().toLowerCase().replace(/\s+/g, "");

/* ============================================================
   MEMBER PAGES
   ============================================================ */

function getTimeStatus(w) {
  if (!w) return "none";
  const t = today();
  if (t < w.start) return "upcoming";
  if (t >= w.start && t <= w.end) return "open";
  return "closed";
}

PAGES.myDashboard = () => {
  const me = SESSION.memberName;
  const info = DB.members.find(m => m.name === me) || {};
  const coop = DB.coops.find(c => c.name === info.coop);
  const w = coop?.contributionWindow;
  const ts = getTimeStatus(w);
  const myC = DB.contribs.filter(c => c.member === me);
  const myS = DB.shares.filter(c => c.member === me);
  const myP = DB.payments.filter(c => c.member === me);
  const myLoans = DB.loans.filter(l => l.member === me);
  const approvedLoans = myLoans.filter(l => l.status === "approved");
  const totalC = myC.filter(x => x.status === "confirmed").reduce((s,x) => s + +x.amount, 0);
  const totalS = myS.reduce((s,x) => s + +x.amount, 0);
  const pending = myP.filter(x => x.status === "pending").length;
  const pendingLoans = myLoans.filter(l => l.status === "pending").length;
  const totalOwed = approvedLoans.reduce((s,l) => {
    const interest = Math.round(l.amount * (l.interestRate || 0) / 100);
    return s + l.amount + interest;
  }, 0);
  const stat = (ic, cl, lbl, val) => `
    <div class="stat"><div class="stat-icon ${cl}"><i data-lucide="${ic}"></i></div>
      <div class="stat-info"><small>${lbl}</small><strong>${val}</strong></div></div>`;
  let windowBanner = "";
  if (w) {
    if (ts === "open") windowBanner = `<div class="notice success">📅 <strong>Igihe cyo kwishura kiragfunguye!</strong><br>${w.label} — ${fmt(w.amountPerMember)} kugeza ${w.end}. <button class="btn primary" style="margin-top:10px" onclick="navigate('myPayContribution')"><i data-lucide="send"></i> Ishyura ubu</button></div>`;
    else if (ts === "upcoming") windowBanner = `<div class="notice info">⏰ Igihe cyo kwishura kizatangira ${w.start}. Urashobora <strong>kwishyura mbere</strong>.</div>`;
    else if (ts === "closed") windowBanner = `<div class="notice danger">🔒 Igihe cyo kwishura cyarangiye (${w.end}).</div>`;
  } else {
    windowBanner = `<div class="notice warn">📅 Nta gihe cyo kwishura kiragfunguka. Uzabona ubutumwa.</div>`;
  }
  $("#app").innerHTML = `
    <div class="panel" style="background:linear-gradient(135deg,#15803d,#166534);color:#fff;border:none">
      <h2 style="font-size:20px;margin-bottom:6px">Murakaza neza, ${me}!</h2>
      <p style="opacity:.9;font-size:13px">${info.coop || ""} — ${info.no || ""}</p>
      ${coop ? `<p style="opacity:.85;font-size:12px;margin-top:6px">💰 Balance ya koperative: <strong>${fmt(coop.balance || 0)}</strong></p>` : ''}
    </div>
    ${windowBanner}
    ${pendingLoans ? `<div class="notice warn">🏦 Ufite <strong>${pendingLoans}</strong> ubusabe bw'inguzanyo butegereje.</div>` : ''}
    <div class="stats">
      ${stat("hand-coins", "g", "Imisanzu yanjye", fmt(totalC))}
      ${stat("pie-chart", "b", "Imigabane yanjye", fmt(totalS))}
      ${stat("clock", "o", "Butegereje", pending)}
      ${stat("banknote", "b", "Inguzanyo n'inyungu", fmt(totalOwed))}
    </div>
    ${approvedLoans.length ? `<div class="panel">
      <div class="panel-head"><h2>🏦 Inguzanyo zemejwe</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Amafaranga</th><th>Inyungu</th><th>Yose</th><th>Due</th></tr></thead>
        <tbody>${approvedLoans.map(l => {
          const interest = Math.round(l.amount * (l.interestRate || 0) / 100);
          const total = l.amount + interest;
          return `<tr>
            <td>${fmt(l.amount)}</td>
            <td>${l.interestRate}%</td>
            <td><strong>${fmt(total)}</strong></td>
            <td>${l.dueDate || '-'}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>
    </div>` : ''}
    <div class="panel">
      <div class="panel-head"><h2>Imisanzu ya vuba</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Amafaranga</th><th>Itariki</th><th>Uburyo</th><th>Status</th></tr></thead>
        <tbody>${myC.slice(-5).reverse().map(c => `<tr>
          <td>${fmt(c.amount)}</td><td>${c.date}</td><td>${c.method}</td>
          <td><span class="status ${c.status}">${c.status === 'pending' ? 'Bitegereje' : 'Byemejwe'}</span></td>
        </tr>`).join("") || `<tr><td colspan="4" class="empty">Nta misanzu</td></tr>`}</tbody>
      </table></div>
    </div>
  `;
  icons();
};

PAGES.myPayContribution = () => {
  const me = SESSION.memberName;
  const info = DB.members.find(m => m.name === me) || {};
  const coop = DB.coops.find(c => c.name === info.coop);
  const w = coop?.contributionWindow;
  const ts = getTimeStatus(w);
  const myPending = DB.payments.filter(p => p.member === me && p.status === "pending");

  let banner = "";
  if (ts === "none") banner = `<div class="notice warn">📅 <strong>Nta gihe cyo kwishura kiragfunguka.</strong> Urashobora kwishyura mbere.</div>`;
  else if (ts === "upcoming") banner = `<div class="notice info">⏰ <strong>Igihe kizatangira ${w.start}.</strong> Urashobora <strong>kwishyura mbere</strong>.</div>`;
  else if (ts === "open") banner = `<div class="notice success">✅ <strong>Igihe kiragfunguye!</strong><br>${w.label} — ${fmt(w.amountPerMember)} kugeza ${w.end}.</div>`;
  else if (ts === "closed") banner = `<div class="notice danger">🔒 <strong>Igihe cyarangiye (${w.end}).</strong> Vugana na admin.</div>`;

  $("#app").innerHTML = `
    ${banner}
    ${myPending.length ? `<div class="notice warn">⏳ Ufite <strong>${myPending.length}</strong> ubwishyu butegereje.</div>` : ""}
    <div class="panel">
      <div class="panel-head"><h2>Ishyura umusanzu</h2></div>
      ${w ? `<div style="background:#f8fafc;padding:14px;border-radius:10px;margin-bottom:16px">
        <strong>${w.label}</strong><br>
        <small style="color:var(--muted)">Igihe: ${w.start} → ${w.end} • Amafaranga: ${fmt(w.amountPerMember)}</small>
      </div>` : ''}
      <div class="field">
        <label>Amafaranga (RWF)</label>
        <input type="number" class="input" id="pmAmount" placeholder="${w ? w.amountPerMember : 'Urugero: 5000'}" value="${w ? w.amountPerMember : ''}" />
      </div>
      <div class="row">
        <div class="field">
          <label>Uburyo bwo kwishyura</label>
          <select class="input" id="pmMethod">
            <option value="MoMo">📱 MTN MoMo</option>
            <option value="Airtel">📱 Airtel Money</option>
            <option value="Cash">💵 Cash (ku biro)</option>
          </select>
        </div>
        <div class="field">
          <label>Nimero ya transaction (Ref)</label>
          <input class="input" id="pmRef" placeholder="Urugero: MP240101.1234.A56789" />
        </div>
      </div>
      <div class="field">
        <label>Itariki wishyuye</label>
        <input type="date" class="input" id="pmDate" value="${today()}" />
      </div>
      <button class="btn primary big" onclick="submitMyPayment()" style="width:100%;justify-content:center">
        <i data-lucide="send"></i> Ohereza ubwishyu
      </button>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Amateka y'ubwishyu bwanjye</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Amafaranga</th><th>Itariki</th><th>Uburyo</th><th>Ref</th><th>Status</th></tr></thead>
        <tbody>${DB.payments.filter(p => p.member === me).slice().reverse().map(p => `<tr>
          <td>${fmt(p.amount)}</td><td>${p.date}</td><td>${p.method}</td>
          <td><span class="pwd-cell">${p.ref}</span></td>
          <td><span class="status ${p.status}">${p.status === 'pending' ? 'Bitegereje' : 'Byemejwe'}</span></td>
        </tr>`).join("") || `<tr><td colspan="5" class="empty">Nta bwishyu</td></tr>`}</tbody>
      </table></div>
    </div>
  `;
  icons();
};

window.submitMyPayment = () => {
  const amount = +$("#pmAmount").value;
  const method = $("#pmMethod").value;
  const ref = $("#pmRef").value.trim();
  const date = $("#pmDate").value;

  if (!amount || amount <= 0) return toast("Amafaranga si nziza", true);
  if (!ref) return toast("Nimero ya transaction (Ref) ni ngombwa", true);
  if (DB.payments.some(p => p.ref === ref && p.status === "pending")) return toast("Iyi Ref isanzweho kandi itegereje", true);
  if (DB.payments.some(p => p.ref === ref && p.status === "confirmed")) return toast("Iyi Ref yamaze kwemezwa", true);

  const me = SESSION.memberName;
  const info = DB.members.find(m => m.name === me) || {};
  if (!info.id) return toast("Umwirondoro wawe ntubonetse", true);

  DB.payments.push({
    id: uid(), member: me, memberId: info.id, coop: info.coop || "",
    amount, date, method, ref, status: "pending"
  });

  addNotification("ALL", "💰 Ubwishyu bushya butegereje", `${me} yishyuye ${fmt(amount)} (${method}). Ref: ${ref}`, "warn");

  toast("✅ Ubwishyu bwoherejwe! Admin azakwemereza.");
  navigate("myPayContribution");
};

/* ===== MEMBER: LOANS ===== */
PAGES.myLoans = () => {
  const me = SESSION.memberName;
  const info = DB.members.find(m => m.name === me) || {};
  const coop = DB.coops.find(c => c.name === info.coop);
  const myLoans = DB.loans.filter(l => l.member === me).slice().reverse();
  const pending = myLoans.filter(l => l.status === "pending");
  const approved = myLoans.filter(l => l.status === "approved");

  $("#app").innerHTML = `
    <div class="notice info">
      🏦 <strong>Saba inguzanyo.</strong> Admin azareba ubusabe bwawe, ashyireho <strong>inyungu</strong>, hanyuma akwemereze cyangwa akubwire impamvu.
    </div>

    ${pending.length ? `<div class="notice warn">⏳ Ufite <strong>${pending.length}</strong> ubusabe butegereje kwemezwa na admin.</div>` : ""}
    ${approved.length ? `<div class="notice success">✅ Ufite <strong>${approved.length}</strong> inguzanyo yemejwe.</div>` : ""}

    <div class="panel">
      <div class="panel-head"><h2>Saba inguzanyo nshya</h2></div>
      <div class="field">
        <label>Amafaranga usaba (RWF)</label>
        <input type="number" class="input" id="lnAmount" placeholder="Urugero: 20000" />
        ${coop ? `<small>Koperative yawe ifite: ${fmt(coop.balance || 0)}</small>` : ''}
      </div>
      <div class="field">
        <label>Impamvu (ubusabe)</label>
        <textarea class="input" id="lnPurpose" rows="2" placeholder="Urugero: Kugura ibikoresho by'ubuhinzi"></textarea>
      </div>
      <div class="field">
        <label>Igihe cyo kwishyura (amezi)</label>
        <select class="input" id="lnDuration">
          <option value="3">3 amezi</option>
          <option value="6" selected>6 amezi</option>
          <option value="12">12 amezi</option>
          <option value="24">24 amezi</option>
        </select>
      </div>
      <div class="notice info" style="font-size:12px">
        ℹ️ <strong>Inyungu (interest rate) izashyirwaho na admin</strong> igihe yemeza inguzanyo.
      </div>
      <button class="btn primary big" onclick="submitLoanRequest()" style="width:100%;justify-content:center">
        <i data-lucide="send"></i> Ohereza ubusabe
      </button>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Amateka y'inguzanyo zanjye</h2></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Amafaranga</th><th>Impamvu</th><th>Igihe</th><th>Inyungu</th><th>Status</th><th>Itariki</th></tr></thead>
        <tbody>${myLoans.map(l => `
          <tr>
            <td><strong>${fmt(l.amount)}</strong></td>
            <td>${l.purpose}</td>
            <td>${l.duration} amezi</td>
            <td>${l.interestRate != null ? l.interestRate + '%' : '<span style="color:var(--muted)">—</span>'}</td>
            <td><span class="status ${
              l.status === 'pending' ? 'pending' :
              l.status === 'approved' ? 'confirmed' :
              l.status === 'rejected' ? 'rejected' : 'inactive'
            }">${
              l.status === 'pending' ? '⏳ Bitegereje' :
              l.status === 'approved' ? '✅ Byemejwe' :
              l.status === 'rejected' ? '❌ Byanzwe' : 'Yarishyuwe'
            }</span></td>
            <td>${l.requestedAt}</td>
          </tr>`).join("") || `<tr><td colspan="6" class="empty">Nta nguzanyo</td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
  icons();
};

window.submitLoanRequest = () => {
  const amount = +$("#lnAmount").value;
  const purpose = $("#lnPurpose").value.trim();
  const duration = +$("#lnDuration").value;

  if (!amount || amount <= 0) return toast("Amafaranga si nziza", true);
  if (!purpose) return toast("Impamvu ni ngombwa", true);

  const me = SESSION.memberName;
  const info = DB.members.find(m => m.name === me) || {};
  if (!info.id) return toast("Umwirondoro wawe ntubonetse", true);

  if (DB.loans.some(l => l.member === me && l.status === "pending"))
    return toast("Ufite ubusabe butegereje. Tegereza admin.", true);

  DB.loans.push({
    id: uid(), member: me, memberId: info.id, coop: info.coop || "",
    amount, purpose, duration,
    interestRate: null,
    requestedAt: today(), status: "pending",
    approvedAt: null, approvedBy: null, rejectReason: null, dueDate: null
  });

  addNotification("ALL", "🏦 Ubusabe bw'inguzanyo bushya",
    `${me} asaba ${fmt(amount)} (${duration} amezi). Impamvu: ${purpose}`, "warn");

  toast("✅ Ubusabe bwoherejwe! Admin azabureba.");
  navigate("myLoans");
};

PAGES.myNotif = () => {
  const list = getMyNotifications();
  $("#app").innerHTML = `
    <div class="notice info">🔔 <strong>Ubutumwa bwawe (${list.filter(n => !n.read).length} bushya)</strong></div>
    ${list.map(n => `<div class="notif-card ${n.type}">
      <strong>${n.title}</strong>
      <p>${n.body}</p>
      <small>${n.date} ${!n.read ? '• <span style="color:#2563eb;font-weight:600">Bushya</span>' : ''}</small>
    </div>`).join("") || '<div class="empty"><i data-lucide="bell-off"></i><p>Nta butumwa</p></div>'}
  `;
  list.forEach(n => n.read = true);
  updateNotifDot();
};

PAGES.myProfile = () => {
  const m = DB.members.find(x => x.name === SESSION.memberName) || {};
  $("#app").innerHTML = `
    <div class="notice info">👤 Uri kwinjira nka <strong>Umunyamuryango</strong></div>
    <div class="panel">
      <div class="panel-head"><h2>Umwirondoro wanjye</h2></div>
      <div class="row">
        <div class="field"><label>Izina</label><input class="input" value="${m.name || ''}" disabled></div>
        <div class="field"><label>Nimero</label><input class="input" value="${m.no || ''}" disabled></div>
      </div>
      <div class="row">
        <div class="field"><label>Koperative</label><input class="input" value="${m.coop || ''}" disabled></div>
        <div class="field"><label>Telefoni</label><input class="input" value="${m.phone || ''}" disabled></div>
      </div>
      <div class="row">
        <div class="field"><label>Username</label><input class="input" value="@${SESSION.username || ''}" disabled></div>
        <div class="field"><label>Status</label><input class="input" value="${m.status === 'active' ? 'Arakora' : 'Ntakora'}" disabled></div>
      </div>
    </div>
  `;
};

PAGES.myContribs = () => {
  const list = DB.contribs.filter(c => c.member === SESSION.memberName);
  const total = list.filter(x => x.status === "confirmed").reduce((s,x) => s + +x.amount, 0);
  $("#app").innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-icon g"><i data-lucide="hand-coins"></i></div><div class="stat-info"><small>Imisanzu yemejwe</small><strong>${fmt(total)}</strong></div></div>
    </div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Amafaranga</th><th>Itariki</th><th>Uburyo</th><th>Ref</th><th>Status</th></tr></thead>
      <tbody>${list.map(c => `<tr>
        <td>${fmt(c.amount)}</td><td>${c.date}</td><td>${c.method}</td><td>${c.ref}</td>
        <td><span class="status ${c.status}">${c.status === 'pending' ? 'Bitegereje' : 'Byemejwe'}</span></td>
      </tr>`).join("") || `<tr><td colspan="5" class="empty">Nta misanzu</td></tr>`}</tbody>
    </table></div></div>
  `;
};

PAGES.myShares = () => {
  const list = DB.shares.filter(c => c.member === SESSION.memberName);
  const total = list.reduce((s,x) => s + +x.amount, 0);
  $("#app").innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-icon b"><i data-lucide="pie-chart"></i></div><div class="stat-info"><small>Imigabane yose</small><strong>${fmt(total)}</strong></div></div>
    </div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Amafaranga</th><th>Itariki</th><th>Ref</th><th>Status</th></tr></thead>
      <tbody>${list.map(c => `<tr>
        <td>${fmt(c.amount)}</td><td>${c.date}</td><td>${c.ref}</td>
        <td><span class="status confirmed">Byemejwe</span></td>
      </tr>`).join("") || `<tr><td colspan="4" class="empty">Nta migabane</td></tr>`}</tbody>
    </table></div></div>
  `;
};

PAGES.myPayments = () => {
  const list = DB.payments.filter(c => c.member === SESSION.memberName).slice().reverse();
  $("#app").innerHTML = `
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Amafaranga</th><th>Itariki</th><th>Uburyo</th><th>Ref</th><th>Status</th></tr></thead>
      <tbody>${list.map(p => `<tr>
        <td>${fmt(p.amount)}</td><td>${p.date}</td><td>${p.method}</td>
        <td><span class="pwd-cell">${p.ref}</span></td>
        <td><span class="status ${p.status}">${p.status === 'pending' ? 'Bitegereje' : 'Byemejwe'}</span></td>
      </tr>`).join("") || `<tr><td colspan="5" class="empty">Nta bwishyu</td></tr>`}</tbody>
    </table></div></div>
  `;
};

PAGES.myAnnounce = () => {
  const list = DB.ann;
  $("#app").innerHTML = `
    ${list.map(a => `<div class="panel">
      <strong>${a.title}</strong>
      <p style="font-size:13px;color:#666;margin-top:6px">${a.body}</p>
      <small style="color:#999">${a.date}</small>
    </div>`).join("") || '<div class="empty"><i data-lucide="megaphone"></i><p>Nta butumwa</p></div>'}
  `;
};

PAGES.mySettings = () => {
  $("#app").innerHTML = `
    <div class="notice info">👤 Uri kwinjira nka <strong>Umunyamuryango</strong></div>
    <div class="panel">
      <div class="panel-head"><h2>🔑 Hindura Ijambo ry'Ibanga</h2></div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">Ni <strong>wowe wenyine</strong> ushobora guhindura password yawe.</p>
      <div class="field"><label>Ijambo ry'ibanga rya kera</label><input class="input" type="password" id="oldPass" /></div>
      <div class="row">
        <div class="field"><label>Ijambo rishya</label><input class="input" type="password" id="newPass" /></div>
        <div class="field"><label>Emeza ijambo rishya</label><input class="input" type="password" id="confirmPass" /></div>
      </div>
      <button class="btn primary" onclick="changePassword()"><i data-lucide="save"></i> Hindura Password</button>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Ururimi</h2></div>
      <button class="btn ghost" onclick="$('#langBtn').click()">Hindura: RW / EN</button>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Sohoka</h2></div>
      <button class="btn danger" onclick="logout()"><i data-lucide="log-out"></i> Sohoka</button>
    </div>
  `;
};

window.changePassword = () => {
  const oldP = $("#oldPass").value;
  const newP = $("#newPass").value;
  const confirmP = $("#confirmPass").value;
  if (!oldP || !newP || !confirmP) return toast("Uzuza ibisabwa byose", true);
  if (newP.length < 4) return toast("Password nshya nibura 4", true);
  if (newP !== confirmP) return toast("Password nshya ntihura", true);
  const acc = DB.accounts.find(a => a.id === SESSION.id);
  if (!acc) return toast("Account ntabonetse", true);
  if (acc.password !== oldP) return toast("Password ya kera si yo", true);
  acc.password = newP;
  toast("✅ Password yahinduwe!");
  navigate("mySettings");
};

function render(page) {
  if (PAGES[page]) PAGES[page]();
  icons();
}

icons();
</script>
